const $=(s,e=document)=>e.querySelector(s), H={'Content-Type':'application/json','X-CMS':'1'};
let cmts={},openCm=new Set(),me=null,doc=null,chapter=null,section=null,es=null,outline=[],locks={},hb=null,shareTok=null;
const assetUrl=s=>shareTok?`/api/shared/${shareTok}/asset/${s}`:`/api/docs/${doc}/asset/${s}`;
const hasPerm=k=>!!(me&&(me.is_super||(me.perms||[]).includes(k)));
const view_restricted_client=()=>hasPerm('doc_view_assigned_only')&&!hasPerm('block_edit_all');
function cellText(c){let n=0;return (c.blocks||[]).map(x=>{const d=x.data||{};if(x.kind==='list_item'){if(d.ordered){n=(d.restart||!n)?1:n+1;return n+(d.sep||')')+' '+x.text}n=0;return '• '+x.text}n=0;return x.text}).join('\n')}
/* daftar dlm sel tabel: awali tiap baris terpilih dgn `1) `/`1. ` / `• ` (server menjadikannya list_item; klik lagi
   = lepas). `sep` pilih gaya nomor (')' default, atau '.'). Utk ordered, nomor LANJUT dari item bernomor
   terakhir SEBELUM seleksi (scan mundur di luar `hit`) -- bukan selalu mulai dari 1, supaya baris baru yang
   ditandai belakangan tetap urut dgn baris yang sudah ada di atasnya. */
function listMark(ordered,sep){sep=sep||')';const sel=getSelection();if(!sel.rangeCount)throw new Error('Klik/sorot baris di dalam sel dulu');
 const r=sel.getRangeAt(0);let host=r.commonAncestorContainer;host=host.nodeType===1?host:host.parentElement;host=host&&host.closest('[contenteditable="true"]');
 if(!host||!host.matches('td,th,.fld'))throw new Error('Klik/sorot baris di dalam sel dulu');
 const w=document.createTreeWalker(host,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===3||n.nodeName==='BR'?1:3});
 const segs=[];let cur=[];for(let n=w.nextNode();n;n=w.nextNode()){cur.push(n);if(n.nodeName==='BR'){segs.push(cur);cur=[]}}segs.push(cur);
 const hitIdx=segs.map((sg,i)=>sg.some(n=>r.intersectsNode(n))?i:-1).filter(i=>i>=0);if(!hitIdx.length)return;
 const any=/^\s*(\d{1,3}[.)]|[•▪◦])\s/,ordRe=/^\s*(\d{1,3})[.)]\s/,bulRe=/^\s*[•▪◦]\s/;
 const first=sg=>sg.find(n=>n.nodeType===3&&n.data.length);
 const re=ordered?/^\s*\d{1,3}[.)]\s/:bulRe;
 const on=hitIdx.every(i=>{const t=first(segs[i]);return t&&re.test(t.data)});
 if(on){for(const i of hitIdx){const t=first(segs[i]);if(t)t.data=t.data.replace(any,'')}host.dispatchEvent(new Event('blur'));return}
 let k=0;
 if(ordered){
  for(let i=hitIdx[0]-1;i>=0;i--){const t=first(segs[i]);if(!t)continue;
   const m=t.data.match(ordRe);if(m){k=+m[1];break}
   if(bulRe.test(t.data)||t.data.trim())break}}
 for(const i of hitIdx){const sg=segs[i],t=first(sg);
  if(t&&any.test(t.data))t.data=t.data.replace(any,'');
  const m=document.createTextNode(ordered?(++k)+sep+' ':'• ');const a=t||sg[0];a.parentNode.insertBefore(m,a)}
 host.dispatchEvent(new Event('blur'))}
/* Cache GET per-URL (ETag): server balas 304 tanpa membangun payload -> render dari salinan lokal.
   Teks JSON disimpan (bukan objek) supaya mutasi caller tak mencemari cache; LRU maks 150 entri. */
const GC=new Map(),GC_MAX=150;
async function api(m,u,b,raw){const hd=raw?{'X-CMS':'1'}:{...H};const c=m==='GET'?GC.get(u):null;if(c)hd['If-None-Match']=c.etag;
 const r=await fetch('/api'+u,{method:m,headers:hd,body:raw?b:(b?JSON.stringify(b):undefined),credentials:'same-origin'});
 if(r.status===304&&c){GC.delete(u);GC.set(u,c);return JSON.parse(c.text)}
 let t='',j={};try{t=await r.text();j=t?JSON.parse(t):{}}catch(e){}
 if(!r.ok){const e=new Error(j.error||r.status);e.status=r.status;e.body=j;throw e}
 const et=m==='GET'&&r.headers.get('ETag');
 if(et){if(GC.size>=GC_MAX&&!GC.has(u))GC.delete(GC.keys().next().value);GC.delete(u);GC.set(u,{etag:et,text:t})}
 return j}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===== inline-markup <-> DOM (cermin utils/docx_build.parse_inline) ===== */
const MARKS={'**':'b','__':'i','++':'u','^^':'sup','~~':'sub'};
function parseInline(t){const out=[];let buf='',flags=new Set(),i=0;const flush=(url)=>{if(buf){out.push([buf,new Set(flags),url||null]);buf=''}};
 while(i<t.length){const c=t[i];
  if(c==='\\'&&i+1<t.length){buf+=t[i+1];i+=2;continue}
  if(MARKS[t.substr(i,2)]){flush();const f=MARKS[t.substr(i,2)];flags.has(f)?flags.delete(f):flags.add(f);i+=2;continue}
  if(c==='!'&&t[i+1]==='['){const m=/^!\[((?:\\.|[^\]\\])*)\]\(([^)]*)\)/.exec(t.slice(i));if(m){flush();out.push(['',new Set(flags),{img:true,alt:m[1],sha1:m[2]}]);i+=m[0].length;continue}}
  if(c==='['){const m=/^\[((?:\\.|[^\]\\])*)\]\(([^)]*)\)/.exec(t.slice(i));if(m){flush();for(const [tx,f] of parseInline(m[1]))out.push([tx,new Set([...f,...flags]),m[2].replace(/%29/g,')')]);i+=m[0].length;continue}}
  buf+=c;i++}
 flush();return out}
const safeUrl=u=>/^(https?:|mailto:)/i.test(u)?u:'#';
function mk2dom(t){const frag=document.createDocumentFragment();const runs=[];
 for(const r of parseInline(t||'')){const l=runs[runs.length-1];const k=[...r[1]].sort().join();if(l&&l.k===k&&l.url===r[2])l.t+=r[0];else runs.push({t:r[0],f:r[1],k,url:r[2]})}
 for(const r of runs){let node=null;
  if(r.url&&typeof r.url==='object'&&r.url.img){
   const img=document.createElement('img');img.src=assetUrl(r.url.sha1);img.alt=r.url.alt||'';
   img.dataset.sha1=r.url.sha1;img.dataset.alt=r.url.alt||'';img.style.cssText='max-width:220px;max-height:220px;vertical-align:middle';
   node=img;for(const f of ['sub','sup','u','i','b']){if(r.f.has(f)){const e=document.createElement(f);e.append(node);node=e}}
   frag.append(node);continue}
  const parts=r.t.split('\n');const inner=document.createDocumentFragment();
  parts.forEach((p,ix)=>{if(ix)inner.append(document.createElement('br'));if(p)inner.append(p)});node=inner;
  for(const f of ['sub','sup','u','i','b']){if(r.f.has(f)){const e=document.createElement(f);e.append(node);node=e}}
  if(r.url){const a=document.createElement('a');a.href=safeUrl(r.url);a.target='_blank';a.rel='noopener';a.append(node);node=a}
  frag.append(node)}
 return frag}
const escMk=t=>t.replace(/[\\*_+^~\[\]]/g,'\\$&');
function dom2mk(root){let out='';const walk=(n,first)=>{for(const c of n.childNodes){
  if(c.nodeType===3){out+=escMk(c.nodeValue.replace(/ /g,' ').replace(/[\r\n]+/g,' '));continue}
  if(c.nodeType!==1)continue;const tg=c.tagName.toLowerCase(),st=c.style||{};
  if(tg==='img'){out+='!['+escMk(c.dataset.alt||c.alt||'')+']('+(c.dataset.sha1||'')+')';continue}
  if(tg==='br'){out+='\n';continue}
  if(['div','p'].includes(tg)){if(out&&!out.endsWith('\n'))out+='\n';walk(c);continue}
  const w=[];if(tg==='b'||tg==='strong'||/^(bold|[6-9]00)$/.test(st.fontWeight))w.push('**');
  if(tg==='i'||tg==='em'||st.fontStyle==='italic')w.push('__');
  if(tg==='u'||/underline/.test(st.textDecorationLine||st.textDecoration||''))w.push('++');
  if(tg==='sup'||st.verticalAlign==='super')w.push('^^');if(tg==='sub'||st.verticalAlign==='sub')w.push('~~');
  if(tg==='a'&&c.getAttribute('href')){out+='[';w.forEach(x=>out+=x);walk(c);[...w].reverse().forEach(x=>out+=x);out+='](' +c.getAttribute('href').replace(/\)/g,'%29')+')';continue}
  w.forEach(x=>out+=x);walk(c);[...w].reverse().forEach(x=>out+=x)}};
 walk(root);out=out.replace(/(\\*)(\*\*|__|\+\+|\^\^|~~)\2/g,(m,bs,mk)=>bs.length%2?m:bs);return out.replace(/\n+$/,'') }

async function notifPanel(){document.querySelector('.notifd')?.remove();

  .sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
 const d=document.createElement('div');d.className='notifd';
 d.innerHTML=items.length?items.map((it,i)=>it.kind==='unread'

 document.body.append(d);

   projectDetailView(it.project_id,{tab:'gantt'})}
  else{try{await api('POST',`/me/notifications/${it.id}/read`)}catch(e){}
   me.unread_notifications=Math.max(0,(me.unread_notifications||1)-1);setNotif((me.unread_tags||0)+(me.unread_notifications||0));
   if(it.project_id&&!it.doc_id)projectDetailView(it.project_id,{tab:'laporan'});   // mention Diskusi -> buka chatnya
   else if(it.doc_id){await openDoc(it.doc_id);if(it.block_id)jumpToBlock(it.block_id,it.chapter_id,it.section_id)}}});

 const dates=tasks.flatMap(t=>[t.start_date,t.end_date]).filter(Boolean).concat([p.start_date,p.end_date].filter(Boolean)).map(d=>+new Date(d));
 const lo=dates.length?Math.min(...dates):+new Date(),hi=dates.length?Math.max(...dates):+new Date()+7*86400000;

 const docMeta={};(dr.documents||[]).forEach(d=>docMeta[d.doc_id]={label:d.label||d.filename});
 const docRows={},manual=[];
 tasks.forEach(t=>{if(t.doc_id&&t.chapter_block_id)(docRows[t.doc_id]=docRows[t.doc_id]||[]).push(t);else manual.push(t)});
 const kids={};manual.forEach(t=>{if(t.parent_task_id)(kids[t.parent_task_id]=kids[t.parent_task_id]||[]).push(t)});
 const view=[];                                        // campuran {grp} | {t,_sub?,_doc?} urut tampil
 Object.keys(docRows).forEach(did=>{const rowsD=docRows[did];
  view.push({grp:{doc_id:+did,rows:rowsD,label:(docMeta[did]||{}).label||('Dokumen #'+did)}});
  if(ganttOpen.has(curProj+':'+did))rowsD.forEach(t=>view.push({t,_doc:1}))});
 manual.filter(t=>!t.parent_task_id).forEach(t=>{view.push({t});(kids[t.id]||[]).forEach(c=>view.push({t:c,_sub:1}))});
 manual.filter(t=>t.parent_task_id&&!manual.some(x=>x.id===t.parent_task_id)).forEach(t=>view.push({t}));
 const grpRow=(g0,i)=>{const sch=g0.rows.filter(t=>t.start_date&&t.end_date);
  const s0=sch.length?sch.map(t=>t.start_date).sort()[0]:null,e0=sch.length?sch.map(t=>t.end_date).sort().slice(-1)[0]:null;
  const avg=sch.length?Math.round(sch.reduce((a,t)=>a+(t.progress_percent||0),0)/sch.length):0;
  const open=ganttOpen.has(curProj+':'+g0.doc_id);

   :'<div class=gtrack></div>';

   <div class=glabel style="font-weight:600">${open?'▾':'▸'} 📄 ${esc(g0.label.slice(0,30))} <span class=badge style="background:var(--mut)">${g0.rows.length} bab</span></div>${bar}</div>`};
 const row=(v,i)=>{if(v.grp)return grpRow(v.grp,i);const t=v.t;
  const pics=[...new Set([...(t.pic||[]),...(t.tags||[])].map(u=>u.username))];
  const draggable=!v._doc;                             // baris bab mengikuti outline, tak bisa di-drag
  const bar=t.start_date&&t.end_date
   ?`<div class=gtrack><div class=gbar data-idx="${i}" style="left:${pos(t.start_date)}%;width:${Math.max(pos(t.end_date)-pos(t.start_date),2)}%;${v._sub||v._doc?'opacity:.75':''}"><i style="width:${t.progress_percent||0}%"></i></div></div>`
   :`<div class=gtrack><div class="gbar unsched" data-idx="${i}">+ jadwalkan</div></div>`;
  return `<div class="grow${draggable?' gdrag':''}" ${draggable?`draggable=true data-tid="${t.id}" data-parent="${t.parent_task_id||''}" data-sub="${v._sub?1:0}"`:''}>
   <div class=glabel title="${esc(t.title||'')}${draggable?' — seret utk atur urutan; jatuhkan di NAMA task lain = jadi sub-task':''}" style="${v._sub?'padding-left:20px;font-size:12px;color:var(--mut)':''}${v._doc?'padding-left:20px;font-size:12px':''}">${draggable?'<span class=gh title="seret">⠿</span> ':''}${v._sub?`<button type=button class=gmain data-gm="${t.id}" data-gma="${t.parent_task_id}" title="Kembalikan jadi task utama (keluar dari sub)">↰</button> ↳ `:''}${t.chapter_block_id?'📖 ':''}${esc((t.title||'').slice(0,32))}${pics.length?` <span class=badge style="background:var(--mut)">${pics.map(esc).join(', ')}</span>`:''}</div>${bar}</div>`};
 $('#ptab').innerHTML='<p style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'
  +'<button id=gsub class=p>+ Sub-task / jadwal</button>'

  +'<div class=gantt><div class=ghead><span></span><span>'+new Date(lo).toLocaleDateString()+' → '+new Date(hi).toLocaleDateString()+'</span></div>'
  +view.map(row).join('')+'</div>'

 $('#ptab').querySelectorAll('.gbar[data-idx]').forEach(el=>el.onclick=e=>{e.stopPropagation();taskDlg(view[+el.dataset.idx].t)});

function renderSCurve(el,{points,today}){
 if(!points||points.length<2){el.innerHTML='<p style="color:var(--mut)">Butuh minimal 1 task berjadwal (tanggal mulai & selesai) untuk kurva S.</p>';return}
 const W=640,H=220,ML=34,MR=10,MT=10,MB=22,pw=W-ML-MR,ph=H-MT-MB;
 const x=i=>ML+i/(points.length-1)*pw,y=pct=>MT+ph-Math.max(0,Math.min(100,pct))/100*ph;
 const plannedPts=points.map((p,i)=>`${x(i)},${y(p.planned)}`).join(' ');
 const actualPts=points.map((p,i)=>p.actual!=null?`${x(i)},${y(p.actual)}`:null).filter(Boolean).join(' ');
 const todayIdx=points.findIndex(p=>p.date>=today);
 const grid=[0,25,50,75,100].map(g=>`<line x1="${ML}" y1="${y(g)}" x2="${W-MR}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/>
  <text x="2" y="${y(g)+4}" font-size="10" fill="var(--mut)">${g}%</text>`).join('');
 const step=Math.max(1,Math.round(points.length/6));
 const xlabels=points.map((p,i)=>i%step===0||i===points.length-1?`<text x="${x(i)}" y="${H-6}" font-size="9" fill="var(--mut)" text-anchor="middle">${p.date.slice(5)}</text>`:'').join('');
 const todayLine=todayIdx>0&&todayIdx<points.length?`<line x1="${x(todayIdx)}" y1="${MT}" x2="${x(todayIdx)}" y2="${MT+ph}" stroke="var(--acc)" stroke-dasharray="2,3" stroke-width="1"/>`:'';
 el.innerHTML=`<div style="display:flex;gap:14px;font-size:11px;color:var(--mut);margin-bottom:4px">
  <span><i style="display:inline-block;width:10px;height:2px;background:var(--mut);vertical-align:middle"></i> Rencana</span>
  <span><i style="display:inline-block;width:10px;height:2px;background:var(--acc);vertical-align:middle"></i> Realisasi</span>
  <span>Hari ini: ${esc(today)}</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${xlabels}${todayLine}
  <polyline points="${plannedPts}" fill="none" stroke="var(--mut)" stroke-width="2" stroke-dasharray="5,3"/>
  ${actualPts?`<polyline points="${actualPts}" fill="none" stroke="var(--acc)" stroke-width="2"/>`:''}
  </svg>`}

 return `${monYear(p.start_date)} – ${monYear(p.end_date)}`}

async function assignView(users){const d=+$('#ad').value;const isAdmin=hasPerm('pic_assign');const canOutline=hasPerm('outline_manage');
 const [{items},{map}]=await Promise.all([api('GET',`/docs/${d}/taggable`),api('GET',`/docs/${d}/pic-map`)]);
 const {assignments}=await api('GET',`/admin/docs/${d}/assign`).catch(()=>({assignments:[]}));
 const parts=['cover','front','body','lampiran'].map(p=>({scope:'part:'+p,label:'Bagian: '+p}));
 const who=sc=>assignments.filter(a=>a.scope===sc);const nonAdmin=users.filter(u=>u.user_id&&!u.is_super&&u.active);
 const partRows=parts.map(x=>`<tr><td>${esc(x.label)}</td><td>${who(x.scope).map(a=>`<span class=badge style="background:var(--mut)">${esc(a.username)}${isAdmin?` <a href="#" data-rm="${a.user_id}|${x.scope}" style="color:#fff">×</a>`:''}</span>`).join(' ')||'<small style="color:var(--mut)">—</small>'}</td>
 ${isAdmin?`<td><select data-add="${x.scope}"><option value="">+ tugaskan…</option>${nonAdmin.map(u=>`<option value=${u.user_id}>${esc(u.username)}</option>`).join('')}</select></td>`:''}</tr>`).join('');
 let curHLevel=1;
 const itemRows=items.map(it=>{const indent=it.kind==='heading'?(it.level-1)*2:curHLevel*2+2;
  if(it.kind==='heading')curHLevel=it.level;
  const node=map[it.id]||{pics:[],direct:false,scope:null};
  const icon=it.kind==='heading'?'📖':it.subtype==='tabel'?'▦':it.subtype==='gambar'?'🖼':'🏷';
  const done=node.pics.length&&node.pics.every(p=>p.status==='done');
  const pics=node.pics.map(p=>`<span class=badge style="background:${p.status==='done'?'#2da44e':'var(--mut)'}">${esc(p.username)}${p.status==='done'?' ✓':''}</span>`).join(' ')
   ||(node.scope?'<small style="color:var(--mut)">(warisan, kosong)</small>':'<small style="color:var(--mut)">—</small>');
  const hiddenBadge=it.hidden?' <span class=badge style="background:var(--warn)" title="Tak ikut diekspor DOCX">🙈</span>':'';
  return `<tr><td style="padding-left:${indent}ch">${icon} ${esc((it.label||'').slice(0,70))}${node.scope&&!node.direct?' <small style="color:var(--mut)">(warisan)</small>':''}${done?' ✓':''}${hiddenBadge}</td>
  <td>${pics}</td><td class=acell><button type=button data-menu="${it.id}" title="Aksi">⋮</button></td></tr>`}).join('');
 $('#asg').innerHTML='<div class=otable><table><tr><th>Bagian</th><th>PIC</th>'+(isAdmin?'<th></th>':'')+'</tr>'+partRows+'</table></div>'

  +(canOutline?'<p><button type=button id=addh>+ Tambah heading…</button></p>':'')
  +'<div class=otable><table><tr><th>Item</th><th>PIC</th><th></th></tr>'+(itemRows||'<tr><td colspan=3 style="color:var(--mut)">Belum ada isi.</td></tr>')+'</table></div>'
  +`<p><small>Yang punya izin "Edit Semua Blok" otomatis boleh mengedit semua bab. PIC di heading/caption/tabel/gambar tertentu meng-override warisan dari atasannya (H1/bagian) hanya utk bagian itu ke bawah — klik ⋮ utk kelola PIC/catatan${canOutline?'/pindahkan posisi (heading memindahkan seluruh isi di bawahnya juga)/sembunyikan dari ekspor (tanpa dihapus)/hapus heading (isi di bawahnya tak ikut terhapus)':''}.${isAdmin?'':' Hanya yang punya izin "Tandai/Lepas PIC" yang bisa menambah/melepas penugasan; PIC yang bersangkutan boleh menandai selesai, yang punya izin "Kelola Outline" boleh mengembalikan.'}</small></p>`;
 if(isAdmin){

  document.querySelectorAll('[data-rm]').forEach(a=>a.onclick=async e=>{e.preventDefault();const [u,sc]=a.dataset.rm.split('|');try{await api('POST','/admin/assign',{doc_id:d,user_id:+u,scope:sc,remove:true});assignView(users)}catch(x){note(x.message,1)}})}

 const paint=async()=>{
  let list=[];try{list=(await api('GET',`/docs/${docId}/comments?block_id=${blockId}`)).comments}catch(e){}
  const line=c=>`<div style="padding:4px 0;border-bottom:1px solid var(--line)${c.resolved_at?';opacity:.55':''}">

   <button type=button data-done="${c.id}" data-cur="${c.resolved_at?1:0}">${c.resolved_at?'Buka lagi':'Selesai'}</button>
   ${c.author===me.username||me.is_super?`<button type=button data-delc="${c.id}">Hapus</button>`:''}
  </div>`;
  m.innerHTML=`<form class=dlg><b>Catatan — ${esc((label||'').slice(0,70)||'(tanpa judul)')}</b>

  d.querySelector('#x').onclick=()=>d.remove();d.querySelector('#ad').onclick=()=>{rows.push({key:null,path:rows[rows.length-1]?rows[rows.length-1].path.split('>').slice(0,-1).join('>').trim().replace(/^\/?/,'')+(rows[rows.length-1].path.includes('>')?' > ':'')+'Kolom baru':'Kolom baru',merge:false,align:'',size:''});draw()};
  d.querySelector('#pv').onclick=async()=>{try{const r=await api('POST',`/blocks/${id}/columns`,{columns:specs(),dry:true});const dt=r.data,pv=d.querySelector('#pvw');pv.innerHTML='';
   pv.append(tblPreview({rows:dt.rows.filter((x,i)=>x.header||i<dt.rows.findIndex(y=>!y.header)+3)}))}catch(e){note(e.message,1)}};
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await api('POST',`/blocks/${id}/columns`,{columns:specs()});d.remove();await st.load(true)}catch(x){note(x.message,1)}}}
 try{await st.load(true)}catch(e){m.remove();fe=null;return note(e.message,1)}
 if(open==='cols')colsDlg()}
function plainPaste(e){e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)}
function insertInlineImage(ed,blockId){if(ed&&ed.focus)ed.focus();
 const sel=window.getSelection();const range=sel.rangeCount?sel.getRangeAt(0).cloneRange():null;
 const f=document.createElement('input');f.type='file';f.accept='image/*';
 f.onchange=async()=>{if(!f.files[0])return;const fd=new FormData();fd.append('file',f.files[0]);fd.append('block_id',blockId);
  try{const a=await api('POST',`/docs/${doc}/inline-asset`,fd,true);
   if(ed&&ed.focus)ed.focus();
   if(range){try{sel.removeAllRanges();sel.addRange(range)}catch(e){}}
   const html=`<img data-sha1="${a.sha1}" data-alt="" src="/api/docs/${doc}/asset/${a.sha1}" style="max-width:220px;max-height:220px;vertical-align:middle">`;
   document.execCommand('insertHTML',false,html)}catch(e){note(e.message,1)}};

function toolbar(ed,rawToggle,lists,blockId){const d=document.createElement('div');d.className='tb';
 const mk=(l,title,fn)=>{const x=document.createElement('button');x.type='button';x.innerHTML=l;x.title=title;x.onmousedown=e=>e.preventDefault();x.onclick=fn;d.append(x);return x};
 const cmd=c=>()=>{ed.focus();document.execCommand(c)};
 mk('<b>B</b>','Tebal (Ctrl+B)',cmd('bold'));mk('<i>I</i>','Miring (Ctrl+I)',cmd('italic'));mk('<u>U</u>','Garis bawah (Ctrl+U)',cmd('underline'));
 mk('x²','Superscript',cmd('superscript'));mk('x₂','Subscript',cmd('subscript'));
 mk('Tautan','Sisipkan tautan',()=>{ed.focus();const u=prompt('URL (https://…):');if(u)document.execCommand('createLink',false,u)});
 mk('Lepas','Hapus tautan',cmd('unlink'));mk('Bersih','Hapus format',cmd('removeFormat'));
 mk('🖼','Sisipkan gambar/ikon/screenshot rumus di sini',()=>insertInlineImage(ed,blockId));
 if(lists){mk('1)','Daftar bernomor, gaya 1) 2) 3) (sorot baris di sel; klik lagi = lepas)',()=>{try{listMark(true,')')}catch(e){note(e.message,1)}});
  mk('1.','Daftar bernomor, gaya 1. 2. 3. (sorot baris di sel; klik lagi = lepas)',()=>{try{listMark(true,'.')}catch(e){note(e.message,1)}});
  mk('•','Daftar bullet (sorot baris di sel; klik lagi = lepas)',()=>{try{listMark(false)}catch(e){note(e.message,1)}})}
 const r=mk('&lt;/&gt;','Lihat/ubah kode markup',rawToggle);r.style.marginLeft='auto';return d}
/* Draft lokal: ketikan di-autosave ke localStorage tiap 3 dtk SELAMA edit (tak ada call server);
   server baru dihubungi saat Simpan. Crash/tab tertutup -> saat blok dibuka lagi ditawarkan pulihkan.
   Draft dihapus saat tersimpan sukses atau Batal (buang sengaja); draft >7 hari dibersihkan saat boot. */
const draftKey=(bid)=>`cmsdraft:${doc}:${bid}`;
function pruneDrafts(){try{const now=Date.now();
 for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(!k||!k.startsWith('cmsdraft:'))continue;
  let d={};try{d=JSON.parse(localStorage.getItem(k)||'{}')}catch(e){}
  if(!d.ts||now-d.ts>7*864e5)localStorage.removeItem(k)}}catch(e){}}
async function edit(el,b){try{await api('POST',`/blocks/${b.id}/lock`);locks[b.id]=1}catch(e){return note(e.message,1)}
 el.classList.add('edit');const old=el.querySelector('.txt');let ed=document.createElement('div');ed.className='wys';ed.contentEditable=true;ed.append(mk2dom(b.text));
 let raw=null;old.replaceWith(ed);document.execCommand('styleWithCSS',false,false);
 const bar=()=>toolbar(ed,toggle,false,b.id);let tb=bar();ed.before(tb);ed.focus();
 const dk=draftKey(b.id);
 try{const d0=JSON.parse(localStorage.getItem(dk)||'null');
  if(d0&&d0.t!==b.text&&confirm(`Ada draft lokal belum tersimpan (${new Date(d0.ts).toLocaleString('id')}${d0.v!==b.version?'; PERHATIAN: blok sudah diubah orang lain sesudahnya':''}). Pulihkan?`)){
   ed.innerHTML='';ed.append(mk2dom(d0.t))}}catch(e){}
 let lastDraft=null;
 const dsave=()=>{try{const t=val();if(t===lastDraft)return;lastDraft=t;
  t===b.text?localStorage.removeItem(dk):localStorage.setItem(dk,JSON.stringify({t,v:b.version,ts:Date.now()}))}catch(e){}};
 const dtimer=setInterval(dsave,3000);
 const setup=e=>{e.onkeydown=k=>{if(k.key==='Enter'&&!k.ctrlKey){k.preventDefault();document.execCommand('insertLineBreak')}else if(k.key==='Enter'&&k.ctrlKey){k.preventDefault();save()}};e.onpaste=plainPaste};setup(ed);
 function toggle(){if(!raw){raw=document.createElement('textarea');raw.value=dom2mk(ed);ed.replaceWith(raw);raw.focus()}
  else{const n=document.createElement('div');n.className='wys';n.contentEditable=true;n.append(mk2dom(raw.value));raw.replaceWith(n);ed=n;raw=null;setup(ed);ed.focus()}
  tb.remove();tb=bar();(raw||ed).before(tb)}
 const acts=el.querySelector('.acts');acts.innerHTML='';
 const done=async(keepDraft)=>{clearInterval(dtimer);if(!keepDraft)try{localStorage.removeItem(dk)}catch(e){}
  delete locks[b.id];try{await api('DELETE',`/blocks/${b.id}/lock`)}catch(e){}};
 const val=()=>raw?raw.value:dom2mk(ed);
 let conflicted=false;   // setelah 409, Batal = "lihat dulu versi orang lain", draft JANGAN dibuang
 async function save(){try{await api('PATCH',`/blocks/${b.id}`,{text:val(),version:b.version});await done();refreshBlock(b.id)}
  catch(e){dsave();if(e.status===409)conflicted=true;
   note(e.status===409?'Konflik: blok diubah orang lain, muat ulang. (Ketikanmu aman di draft lokal)':e.message,1)}}
 const s=document.createElement('button');s.className='p';s.textContent='Simpan (Ctrl+Enter)';s.onclick=save;
 const c=document.createElement('button');c.textContent='Batal';c.onclick=async()=>{await done(conflicted);refreshBlock(b.id)};acts.append(s,c)}
async function hist(el,b){const {history}=await api('GET',`/blocks/${b.id}/history`);let p=el.querySelector('.hist');if(p){p.remove();return}
 p=document.createElement('div');p.className='hist meta';p.style.flexDirection='column';p.style.alignItems='flex-start';
 history.slice().reverse().slice(0,15).forEach(h=>{const r=document.createElement('div');r.innerHTML=`v${h.version} · ${esc(h.changed_by||'')} · ${esc((h.text||'').slice(0,80))} `;
  if(b.can_edit){const x=document.createElement('button');x.textContent='Kembalikan';x.onclick=()=>api('POST',`/blocks/${b.id}/revert`,{version:h.version}).catch(e=>note(e.message,1));r.append(x)}p.append(r)});el.append(p)}
async function refreshBlock(id){if(fe&&fe.id===id&&fe.sync)fe.sync();const el=$(`.blk[data-id="${id}"]`);if(!el)return;if(el.classList.contains('edit')&&locks[id])return;
 await loadCmts();try{const {block}=await api('GET',`/blocks/${id}`);if(block.deleted)return el.remove();el.replaceWith(view(block))}catch(e){el.remove()}}
let rl=null;function reloadSoon(){clearTimeout(rl);rl=setTimeout(()=>{if(!$('.blk.edit'))(section?loadSection(section):loadChapter());loadOutline()},400)}
/* Patch DOM dari event SSE (bukan muat ulang seluruh bab): delete=cabut node, insert=ambil blok baru
   saja & sisip setelah anchor. Fallback reloadSoon bila anchor tak terlihat/outline berubah (g)/sedang edit. */
async function patchInsert(d){
 const anchor=d.after&&$(`#ed .blk[data-id="${d.after}"]`);
 if(!anchor||!Array.isArray(d.ids)||!d.ids.length||d.g||$('.blk.edit'))return reloadSoon();
 let prev=anchor,heads=false;
 for(const id of d.ids){const {block}=await api('GET',`/blocks/${id}`);const el=view(block);prev.after(el);prev=el;if(block.kind==='heading')heads=true}
 if(heads)loadOutline()}
function subscribe(){if(es)es.close();es=new EventSource(`/api/docs/${doc}/events`+(chapter?`?chapter=${chapter}`:''));
 for(const t of ['block','lock','unlock'])es.addEventListener(t,e=>{const d=JSON.parse(e.data);if(d.g&&t==='block')loadOutline();if(d.by!==me.username||t==='block')refreshBlock(d.id)});
 es.addEventListener('comment',e=>{const d=JSON.parse(e.data);refreshBlock(d.id)});
 es.addEventListener('pic',e=>{const d=JSON.parse(e.data);loadOutline();if(d.id)refreshBlock(d.id)});
 es.addEventListener('insert',e=>{patchInsert(JSON.parse(e.data)).catch(reloadSoon)});
 es.addEventListener('delete',e=>{const d=JSON.parse(e.data);const el=$(`#ed .blk[data-id="${d.id}"]`);
  if(!el||d.g||$('.blk.edit'))return reloadSoon();const isH=el.classList.contains('h');el.remove();if(isH)loadOutline()});
 for(const t of ['move','resync'])es.addEventListener(t,reloadSoon)}
$('#bgal').onclick=async()=>{try{const {assets}=await api('GET',`/docs/${doc}/gallery`);galleryDlg(assets)}catch(e){note(e.message,1)}};
async function jumpToBlock(blockId,chapterId,sectionId,dlgEl){
 if(dlgEl)dlgEl.remove();
 chapter=chapterId;
 if(sectionId&&sectionId!==chapterId){await loadOutline();await loadSection(sectionId);subscribe()}
 else{await loadOutline();await loadChapter();subscribe()}

   :`<span style="display:block;font-size:11px;color:var(--mut);cursor:not-allowed" title="${u.can_edit?'Bagian tanpa heading, navigasi tak tersedia':'Kamu tak terkait dengan bagian ini'}">📍 ${esc(u.heading)}</span>`};

 <p style="color:var(--mut);font-size:12px;margin:0">${assets.length} gambar di dokumen ini. Klik thumbnail utk lihat/unduh versi asli; klik lokasi di bawahnya utk lompat ke bloknya (kalau kamu terkait dengan bagian itu).</p>
 <div class=rg>${assets.map(a=>`<div>
  <a href="/api/docs/${doc}/asset/${a.sha1}?original=1" target=_blank style="display:block">
  <img src="/api/docs/${doc}/asset/${a.sha1}" style="width:100%;height:120px;object-fit:cover;border-radius:6px;border:1px solid var(--line)"></a>
  <small style="display:block;color:var(--mut);word-break:break-all">${esc(a.filename)}</small>
  <small style="color:var(--mut)">${a.px_w}×${a.px_h} · ${a.size?Math.round(a.size/1024)+' KB':''} · dipakai ${a.uses}×</small>
  ${a.usages.length?`<div style="margin-top:3px">${a.usages.map(usageLine).join('')}</div>`:'<small style="color:var(--mut)">Tidak dipakai di blok manapun</small>'}
 </div>`).join('')||'<p style="color:var(--mut)">Belum ada gambar di dokumen ini.</p>'}</div>
 <div style="display:flex;justify-content:flex-end;margin-top:8px"><button type=button id=x>Tutup</button></div></div>`;
 document.body.append(m);m.querySelector('#x').onclick=()=>m.remove();
 m.onclick=e=>{if(e.target===m)m.remove()};
 m.querySelectorAll('[data-jump]').forEach(a=>a.onclick=e=>{e.preventDefault();
  jumpToBlock(+a.dataset.jump,+a.dataset.chap,a.dataset.sec?+a.dataset.sec:null,m)})}
$('#bexp').onclick=async()=>{try{const j=await api('POST',`/docs/${doc}/export`);note('Ekspor berjalan…');
