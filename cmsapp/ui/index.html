<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMS Kolaborasi</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--mut:#6b7482;--line:#dde1e7;--acc:#1f6feb;--warn:#b54708;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e6e9ee;--mut:#8b94a3;--line:#2a2f38;--acc:#4c8dff;--warn:#f0a35e;--card:#1c2027}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
header{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header b{flex:1}#login{max-width:320px;margin:15vh auto;display:grid;gap:8px}
#main{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 45px)}
#side{overflow:auto;border-right:1px solid var(--line);padding:8px;background:var(--card)}
#side a{display:block;padding:3px 6px;border-radius:4px;cursor:pointer;color:var(--fg)}#side a:hover{background:var(--bg)}
#side a.mine{font-weight:600}#side a.cur{background:var(--bg);outline:1px solid var(--acc)}
#side a.lv2,#side a.lv3,#side a.lv4{font-size:12.5px;color:var(--mut)}#side a.lv2:hover,#side a.lv3:hover,#side a.lv4:hover{color:var(--fg)}
#ed{overflow:auto;padding:14px 22px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;position:relative}
.blk .meta{font-size:11px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.blk.locked{border-color:var(--warn)}.blk .txt{white-space:pre-wrap;min-height:1.4em}
.blk.h .txt{font-weight:700}.blk .acts{display:none;gap:4px;margin-top:6px;flex-wrap:wrap}.blk:hover .acts,.blk.edit .acts{display:flex}
textarea{width:100%;min-height:90px}table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:3px 6px}
td[contenteditable]:focus{outline:2px solid var(--acc)}img{max-width:100%}
#bar{position:fixed;right:12px;bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;max-width:320px}
.cm{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}.cm .c{margin:4px 0;padding:4px 8px;border-left:3px solid var(--acc);background:var(--bg);border-radius:4px}.cm .c.re{margin-left:22px}.cm .c.done{opacity:.55;border-left-color:var(--mut)}.cm .c small{color:var(--mut)}.cm form{display:flex;gap:6px;margin-top:6px}.cm input{flex:1}.mask{position:fixed;inset:0;background:#0007;z-index:20;display:grid;place-items:center}.dlg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;width:min(460px,92vw);display:grid;gap:8px}.dlg label{display:grid;gap:2px;font-size:12px;color:var(--mut)}.dlg>*{min-width:0}.dlg select,.dlg input,.dlg textarea{width:100%;max-width:100%;box-sizing:border-box}.tb{display:flex;gap:4px;margin-bottom:4px}.wys{min-height:70px;padding:6px 8px;border:1px solid var(--acc);border-radius:6px;background:var(--card);white-space:pre-wrap;outline:none}.txt a,.wys a{color:var(--acc)}.badge{background:var(--acc);color:#fff;border-radius:9px;padding:0 6px;font-size:11px}.err{color:#d1242f}#docs{padding:20px}@media(max-width:800px){#main{grid-template-columns:1fr}#side{max-height:30vh}}
.tw{overflow:auto;max-width:100%}.tw table{width:auto;min-width:100%}.tw td,.tw th{min-width:120px;vertical-align:top;padding:6px 8px;white-space:pre-wrap;word-break:break-word}.tw th{background:var(--bg)}
.tw td[contenteditable]{min-height:2.4em;font-size:13px}
.fmask{position:fixed;inset:0;background:var(--bg);z-index:19;display:flex;flex-direction:column}.fhead{padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fhead .tb{flex-basis:100%}.fbody{overflow:auto;padding:12px 16px;flex:1}.rc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 10px}.rc.sec{border-left:4px solid var(--acc)}
.rc .rh{display:flex;gap:4px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.rc .rh b{margin-right:auto}.rc .rh button{padding:1px 7px;font-size:12px}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}.fl small{display:block;color:var(--mut);font-size:11px;line-height:1.2;margin-bottom:2px}
.fld{border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:2.6em;background:var(--bg);white-space:pre-wrap;word-break:break-word}.fld:focus{outline:2px solid var(--acc)}
.fl.w2{grid-column:span 2}.fl.wall{grid-column:1/-1}.crow{display:grid;grid-template-columns:1fr auto 84px 64px auto;gap:6px;margin:4px 0;align-items:center}
.ftools{display:flex;gap:6px;align-items:center;margin-left:auto}
.gantt{overflow:auto}.gantt .ghead{display:grid;grid-template-columns:240px 1fr;font-size:11px;color:var(--mut);margin-bottom:4px}
.gantt .grow{display:grid;grid-template-columns:240px 1fr;align-items:center;border-bottom:1px solid var(--line);min-height:32px;gap:6px}
.gantt .glabel{padding:4px 6px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt .gtrack{position:relative;height:20px;margin:4px 8px 4px 0;background:var(--bg);border-radius:4px}
.gantt .gbar{position:absolute;top:0;bottom:0;border-radius:4px;background:#8fb8f0;cursor:pointer;overflow:hidden}
.gantt .gbar i{position:absolute;inset:0;background:var(--acc);border-radius:4px 0 0 4px}
.gantt .gbar.unsched{background:transparent;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);width:140px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:none;border-radius:6px 6px 0 0;background:transparent;padding:6px 12px}
.tabs button.cur{background:var(--card);border:1px solid var(--line);border-bottom-color:var(--card);font-weight:600}
.pbar{background:var(--bg);border-radius:6px;height:10px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc)}
.notifd{position:fixed;right:12px;top:42px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px #0003;width:320px;max-height:60vh;overflow:auto;z-index:25;padding:6px}
.notifd .ni{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px}.notifd .ni:hover{background:var(--bg)}.notifd .ni b{display:block}
.otable{overflow-x:auto;-webkit-overflow-scrolling:touch}.otable table{width:100%;border-collapse:collapse}
.otable td,.otable th{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.otable td:first-child{min-width:150px}.otable .acell{white-space:nowrap}.otable .acell button{padding:3px 7px;font-size:13px;margin:1px 2px 1px 0}
@media(max-width:640px){
 .otable td,.otable th{padding:4px}.otable .acell button{padding:5px 7px;font-size:14px}
 .rg{grid-template-columns:1fr!important}
 .dlg{width:100vw!important;max-width:100vw!important;padding:12px!important;border-radius:0!important}
 #docs{padding:10px 0}
 #ed{padding:10px 6px}
 header{padding:8px 6px}
}
</style></head><body>
<header><b>CMS Kolaborasi</b><span id="who"></span><span id="pres" title="online"></span>
<span id="bnotif" class="badge" hidden style="cursor:pointer" title="Tugas yang menandai saya"></span>
<button id="bproj" hidden>Proyek</button><button id="bdocs" hidden>Dokumen</button><button id="badm" hidden>Admin</button><button id="bact" hidden>Aktivitas</button><button id="bopt" hidden>⚙ Opsi ekspor</button><button id="bexp" hidden>Ekspor DOCX</button><button id="bout" hidden>Keluar</button></header>
<div id="app"></div><div id="bar" hidden></div>
<script>
const $=(s,e=document)=>e.querySelector(s), H={'Content-Type':'application/json','X-CMS':'1'};
let cmts={},openCm=new Set(),me=null,doc=null,chapter=null,section=null,es=null,outline=[],locks={},hb=null;
function cellText(c){let n=0;return (c.blocks||[]).map(x=>{const d=x.data||{};if(x.kind==='list_item'){if(d.ordered){n=(d.restart||!n)?1:n+1;return n+') '+x.text}n=0;return '• '+x.text}n=0;return x.text}).join('\n')}
/* daftar dlm sel tabel: awali tiap baris terpilih dgn `1) ` / `• ` (server menjadikannya list_item; klik lagi = lepas) */
function listMark(ordered){const sel=getSelection();if(!sel.rangeCount)throw new Error('Klik/sorot baris di dalam sel dulu');
 const r=sel.getRangeAt(0);let host=r.commonAncestorContainer;host=host.nodeType===1?host:host.parentElement;host=host&&host.closest('[contenteditable="true"]');
 if(!host||!host.matches('td,th,.fld'))throw new Error('Klik/sorot baris di dalam sel dulu');
 const w=document.createTreeWalker(host,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===3||n.nodeName==='BR'?1:3});
 const segs=[];let cur=[];for(let n=w.nextNode();n;n=w.nextNode()){cur.push(n);if(n.nodeName==='BR'){segs.push(cur);cur=[]}}segs.push(cur);
 const hit=segs.filter(sg=>sg.some(n=>r.intersectsNode(n)));if(!hit.length)return;
 const re=ordered?/^\s*\d{1,3}[.)]\s/:/^\s*[•▪◦]\s/,any=/^\s*(\d{1,3}[.)]|[•▪◦])\s/;
 const first=sg=>sg.find(n=>n.nodeType===3&&n.data.length);
 const on=hit.every(sg=>{const t=first(sg);return t&&re.test(t.data)});let k=0;
 for(const sg of hit){const t=first(sg);
  if(on){t.data=t.data.replace(any,'');continue}
  if(t&&any.test(t.data))t.data=t.data.replace(any,'');
  const m=document.createTextNode(ordered?(++k)+') ':'• ');const a=t||sg[0];a.parentNode.insertBefore(m,a)}
 host.dispatchEvent(new Event('blur'))}
async function api(m,u,b,raw){const r=await fetch('/api'+u,{method:m,headers:raw?{'X-CMS':'1'}:H,body:raw?b:(b?JSON.stringify(b):undefined),credentials:'same-origin'});
 let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||r.status);e.status=r.status;e.body=j;throw e}return j}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===== inline-markup <-> DOM (cermin utils/docx_build.parse_inline) ===== */
const MARKS={'**':'b','__':'i','++':'u','^^':'sup','~~':'sub'};
function parseInline(t){const out=[];let buf='',flags=new Set(),i=0;const flush=(url)=>{if(buf){out.push([buf,new Set(flags),url||null]);buf=''}};
 while(i<t.length){const c=t[i];
  if(c==='\\'&&i+1<t.length){buf+=t[i+1];i+=2;continue}
  if(MARKS[t.substr(i,2)]){flush();const f=MARKS[t.substr(i,2)];flags.has(f)?flags.delete(f):flags.add(f);i+=2;continue}
  if(c==='['){const m=/^\[((?:\\.|[^\]\\])*)\]\(([^)]*)\)/.exec(t.slice(i));if(m){flush();for(const [tx,f] of parseInline(m[1]))out.push([tx,new Set([...f,...flags]),m[2].replace(/%29/g,')')]);i+=m[0].length;continue}}
  buf+=c;i++}
 flush();return out}
const safeUrl=u=>/^(https?:|mailto:)/i.test(u)?u:'#';
function mk2dom(t){const frag=document.createDocumentFragment();const runs=[];
 for(const r of parseInline(t||'')){const l=runs[runs.length-1];const k=[...r[1]].sort().join();if(l&&l.k===k&&l.url===r[2])l.t+=r[0];else runs.push({t:r[0],f:r[1],k,url:r[2]})}
 for(const r of runs){let node=null;const parts=r.t.split('\n');const inner=document.createDocumentFragment();
  parts.forEach((p,ix)=>{if(ix)inner.append(document.createElement('br'));if(p)inner.append(p)});node=inner;
  for(const f of ['sub','sup','u','i','b']){if(r.f.has(f)){const e=document.createElement(f);e.append(node);node=e}}
  if(r.url){const a=document.createElement('a');a.href=safeUrl(r.url);a.target='_blank';a.rel='noopener';a.append(node);node=a}
  frag.append(node)}
 return frag}
const escMk=t=>t.replace(/[\\*_+^~\[\]]/g,'\\$&');
function dom2mk(root){let out='';const walk=(n,first)=>{for(const c of n.childNodes){
  if(c.nodeType===3){out+=escMk(c.nodeValue.replace(/ /g,' ').replace(/[\r\n]+/g,' '));continue}
  if(c.nodeType!==1)continue;const tg=c.tagName.toLowerCase(),st=c.style||{};
  if(tg==='br'){out+='\n';continue}
  if(['div','p'].includes(tg)){if(out&&!out.endsWith('\n'))out+='\n';walk(c);continue}
  const w=[];if(tg==='b'||tg==='strong'||/^(bold|[6-9]00)$/.test(st.fontWeight))w.push('**');
  if(tg==='i'||tg==='em'||st.fontStyle==='italic')w.push('__');
  if(tg==='u'||/underline/.test(st.textDecorationLine||st.textDecoration||''))w.push('++');
  if(tg==='sup'||st.verticalAlign==='super')w.push('^^');if(tg==='sub'||st.verticalAlign==='sub')w.push('~~');
  if(tg==='a'&&c.getAttribute('href')){out+='[';w.forEach(x=>out+=x);walk(c);[...w].reverse().forEach(x=>out+=x);out+='](' +c.getAttribute('href').replace(/\)/g,'%29')+')';continue}
  w.forEach(x=>out+=x);walk(c);[...w].reverse().forEach(x=>out+=x)}};
 walk(root);out=out.replace(/(\\*)(\*\*|__|\+\+|\^\^|~~)\2/g,(m,bs,mk)=>bs.length%2?m:bs);return out.replace(/\n+$/,'') }
function note(t,err){const b=$('#bar');b.hidden=!t;b.className=err?'err':'';b.textContent=t||'';if(t)setTimeout(()=>{b.hidden=true},4000)}
async function boot(){try{me=(await api('GET','/me')).user}catch(e){return loginView()}
 $('#who').textContent=(me.username)+' · '+me.role;$('#bout').hidden=false;$('#badm').hidden=me.role!=='admin';$('#bact').hidden=me.role!=='admin';$('#bdocs').hidden=false;$('#bproj').hidden=false;
 setNotif(me.unread_tags||0);projectsView()}
function setNotif(n){const b=$('#bnotif');b.hidden=!n;b.textContent='🔔 '+n}
async function notifPanel(){document.querySelector('.notifd')?.remove();
 let tags=[];try{tags=(await api('GET','/me/tags?unread=1')).tags}catch(e){}
 const d=document.createElement('div');d.className='notifd';
 d.innerHTML=tags.length?tags.map((t,i)=>`<div class=ni data-i="${i}"><b>${esc(t.project_name)}</b>${esc(t.title||'')}<br><small>${esc(t.tagged_at||'')}</small></div>`).join('')
  :'<p style="padding:8px;color:var(--mut)">Tidak ada tugas baru.</p>';
 document.body.append(d);
 d.querySelectorAll('.ni').forEach(x=>x.onclick=async()=>{const t=tags[+x.dataset.i];try{await api('POST',`/tasks/${t.task_id}/read`)}catch(e){}
  d.remove();me.unread_tags=Math.max(0,(me.unread_tags||1)-1);setNotif(me.unread_tags);projectDetailView(t.project_id,{tab:'gantt'})});
 setTimeout(()=>document.addEventListener('click',function h(e){if(!d.contains(e.target)&&e.target!==$('#bnotif')){d.remove();document.removeEventListener('click',h)}}),0)}
function loginView(){$('#app').innerHTML=`<form id=login><h3>Masuk</h3><input name=u placeholder=username autofocus><input name=p type=password placeholder=password><button class=p>Masuk</button><span class=err id=le></span></form>`;
 $('#login').onsubmit=async e=>{e.preventDefault();try{await api('POST','/login',{username:e.target.u.value,password:e.target.p.value});boot()}catch(x){$('#le').textContent=x.message}}}
$('#badm').onclick=()=>adminView();
$('#bact').onclick=()=>activityView();
$('#bdocs').onclick=()=>docsView();
$('#bproj').onclick=()=>projectsView();
$('#bnotif').onclick=notifPanel;
$('#bout').onclick=async()=>{await api('POST','/logout');location.reload()};
async function docsView(){closeDoc();const {docs}=await api('GET','/docs');
 $('#app').innerHTML='<div id=docs><h3>Dokumen</h3>'+(me.role==='admin'?'<p><button id=up>+ Unggah DOCX</button></p>':'')+(docs.map(d=>`<p><a href="#" data-id="${d.id}">${esc(d.filename)}</a> <small>${esc(d.status)}</small></p>`).join('')||'<p>Belum ada dokumen.</p>')+'</div>';
 document.querySelectorAll('#docs a').forEach(a=>a.onclick=e=>{e.preventDefault();openDoc(+a.dataset.id)});
 if($('#up'))$('#up').onclick=uploadDoc}
function uploadDoc(){const f=document.createElement('input');f.type='file';f.accept='.docx';f.onchange=async()=>{const fd=new FormData();fd.append('file',f.files[0]);
 note('Mengunggah & mengekstrak… (bisa beberapa detik)');try{const r=await api('POST','/admin/docs',fd,true);note('Selesai: '+r.blocks+' blok');docsView()}catch(e){note(e.message,1)}};f.click()}

// ===================== Manajemen Proyek =====================
let curProj=null,curTab='ringkasan',curCat='surat';
const FILE_CATS=[['surat','Surat'],['data_mentah','Data Mentah'],['dokumen_pendukung','Dokumen Pendukung'],['galeri','Galeri'],
 ['tender','Tender'],['pitching','Pitching'],['lab','Permohonan Lab'],['mom','Minutes of Meeting']];

const ID_BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function idDate(s){if(!s)return '?';const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(!m)return s;return `${+m[3]} ${ID_BULAN[+m[2]-1]} ${m[1]}`}

async function projectsView(){closeDoc();const {projects}=await api('GET','/projects');
 $('#app').innerHTML='<div id=docs><h3>Manajemen Proyek</h3>'+(me.role==='admin'?'<p><button id=npr>+ Proyek baru</button></p>':'')
 +'<div class=rg>'+(projects.map(p=>{const pct=p.progress_effective||0,rc=p.report_counts||{};
  return `<div class=rc data-id="${p.id}" style="cursor:pointer"><div class=rh><b>${esc(p.name)}</b><span class=badge>${esc(p.status)}</span>${me.role==='admin'?`<button type=button data-menu="${p.id}" style="margin-left:6px;padding:1px 7px" title="Menu proyek" onclick="event.stopPropagation()">⋮</button>`:''}</div>
  <div style="color:var(--mut);font-size:12px">${esc(p.client||'')}</div>
  <div style="display:flex;align-items:center;gap:6px;margin:6px 0"><div class=pbar style="flex:1"><i style="width:${pct}%"></i></div><small>${pct}%</small></div>
  <div style="font-size:11px;color:var(--mut)">${idDate(p.start_date)} → ${idDate(p.end_date)}</div>
  <div style="margin-top:6px">${['draft','interim','final'].map(t=>rc[t]?`<span class=badge style="background:var(--mut)">${t}: ${rc[t]}</span> `:'').join('')}</div></div>`}).join('')
  ||'<p>Belum ada proyek.</p>')+'</div></div>';
 document.querySelectorAll('#docs .rc[data-id]').forEach(c=>c.onclick=()=>projectDetailView(+c.dataset.id));
 document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();projectMenu(projects.find(x=>x.id===+b.dataset.menu),projects)});
 if($('#npr'))$('#npr').onclick=()=>projectDlg(projects)}

function projectMenu(p,projects){const m=document.createElement('div');m.className='mask';
 m.innerHTML=`<div class=dlg><b>${esc(p.name)}</b>
 <button type=button id=mco>📑 Salin outline dokumen dari dokumen lain…</button>
 <button type=button id=mct>👥 Salin tim dari dokumen lain…</button>
 <button type=button id=mts>💰 Set tim sales…</button>
 <button type=button id=mpic>🧑‍💼 Set PIC proyek…</button>
 <button type=button id=mpc>☎ Set kontak pemrakarsa…</button>
 <div style="display:flex;justify-content:flex-end"><button type=button id=x>Tutup</button></div></div>`;
 document.body.append(m);m.querySelector('#x').onclick=()=>m.remove();
 m.querySelector('#mco').onclick=()=>{m.remove();cloneDocDlg(p,projects)};
 m.querySelector('#mct').onclick=()=>{m.remove();cloneTeamDlg(p,projects)};
 m.querySelector('#mts').onclick=()=>{m.remove();setProjectFieldDlg(p,'sales_team','Tim sales')};
 m.querySelector('#mpic').onclick=()=>{m.remove();setProjectFieldDlg(p,'pic','PIC proyek')};
 m.querySelector('#mpc').onclick=()=>{m.remove();setProjectFieldDlg(p,'pemrakarsa_contact','Kontak pemrakarsa',true)}}

function setProjectFieldDlg(p,field,label,multiline){const m=document.createElement('div');m.className='mask';
 m.innerHTML=`<form class=dlg><b>${esc(label)} — ${esc(p.name)}</b>
 <label>${esc(label)}${multiline?`<textarea name=v rows=3 placeholder="nama, jabatan, telp/email">${esc(p[field]||'')}</textarea>`:`<input name=v value="${esc(p[field]||'')}">`}</label>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button type=button id=x>Batal</button><button class=p>Simpan</button></div></form>`;
 document.body.append(m);const f=m.querySelector('form');m.querySelector('#x').onclick=()=>m.remove();
 f.onsubmit=async e=>{e.preventDefault();try{await api('PATCH',`/projects/${p.id}`,{[field]:f.v.value});m.remove();note('Tersimpan');projectsView()}catch(x){note(x.message,1)}}}

async function cloneDocDlg(p,projects){

function renderSCurve(el,{points,today}){
 if(!points||points.length<2){el.innerHTML='<p style="color:var(--mut)">Butuh minimal 1 task berjadwal (tanggal mulai & selesai) untuk kurva S.</p>';return}
 const W=640,H=220,ML=34,MR=10,MT=10,MB=22,pw=W-ML-MR,ph=H-MT-MB;
 const x=i=>ML+i/(points.length-1)*pw,y=pct=>MT+ph-Math.max(0,Math.min(100,pct))/100*ph;
 const plannedPts=points.map((p,i)=>`${x(i)},${y(p.planned)}`).join(' ');
 const actualPts=points.map((p,i)=>p.actual!=null?`${x(i)},${y(p.actual)}`:null).filter(Boolean).join(' ');
 const todayIdx=points.findIndex(p=>p.date>=today);
 const grid=[0,25,50,75,100].map(g=>`<line x1="${ML}" y1="${y(g)}" x2="${W-MR}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/>
  <text x="2" y="${y(g)+4}" font-size="10" fill="var(--mut)">${g}%</text>`).join('');
 const step=Math.max(1,Math.round(points.length/6));
 const xlabels=points.map((p,i)=>i%step===0||i===points.length-1?`<text x="${x(i)}" y="${H-6}" font-size="9" fill="var(--mut)" text-anchor="middle">${p.date.slice(5)}</text>`:'').join('');
 const todayLine=todayIdx>0&&todayIdx<points.length?`<line x1="${x(todayIdx)}" y1="${MT}" x2="${x(todayIdx)}" y2="${MT+ph}" stroke="var(--acc)" stroke-dasharray="2,3" stroke-width="1"/>`:'';
 el.innerHTML=`<div style="display:flex;gap:14px;font-size:11px;color:var(--mut);margin-bottom:4px">
  <span><i style="display:inline-block;width:10px;height:2px;background:var(--mut);vertical-align:middle"></i> Rencana</span>
  <span><i style="display:inline-block;width:10px;height:2px;background:var(--acc);vertical-align:middle"></i> Realisasi</span>
  <span>Hari ini: ${esc(today)}</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${xlabels}${todayLine}
  <polyline points="${plannedPts}" fill="none" stroke="var(--mut)" stroke-width="2" stroke-dasharray="5,3"/>
  ${actualPts?`<polyline points="${actualPts}" fill="none" stroke="var(--acc)" stroke-width="2"/>`:''}
  </svg>`}
