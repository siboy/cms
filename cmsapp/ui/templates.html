<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Template Laporan AMDAL &amp; UKL-UPL — sdrive</title>
<link rel="icon" href="/app-icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f3f5f9;--fg:#18202e;--mut:#64748b;--line:#e2e7ef;--acc:#2563eb;--acc-soft:#2563eb1a;--card:#fff;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--warn-bg:#fef3c7}
@media(prefers-color-scheme:dark){:root{--bg:#0f141c;--fg:#e6ebf2;--mut:#8d97a9;--line:#263144;--acc:#4c8dff;--acc-soft:#4c8dff26;--card:#171e29;--ok:#4ade80;--bad:#f87171;--warn:#f0a35e;--warn-bg:#3a2a12}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header b{flex:1;min-width:140px}a{color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:12px 14px 60px}
.mut{color:var(--mut)}.small{font-size:12px}.err{color:var(--bad)}.hide{display:none!important}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
button{cursor:pointer;background:var(--card)}button:hover{border-color:var(--acc)}button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}button:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar .q{flex:1 1 260px;font-size:15px;padding:9px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px}.chip.cur{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.layout{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:860px){.layout{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer}.card:hover{border-color:var(--acc)}.card.cur{border-color:var(--acc);background:var(--acc-soft)}
.card b{display:block}.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc)}.badge.gr{background:#15803d1f;color:var(--ok)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:60px}
.detail h2{margin:0 0 4px;font-size:18px}
.tree{border:1px solid var(--line);border-radius:8px;padding:6px 4px;max-height:calc(var(--vh,1vh)*60);overflow:auto;background:var(--bg);margin:10px 0}
.tree div{display:flex;gap:8px;align-items:baseline;padding:2px 8px;border-radius:5px}.tree div:hover{background:var(--acc-soft)}
.tree .l1{font-weight:700;margin-top:6px}.tree .l2{padding-left:26px}.tree .l3{padding-left:46px;font-size:13px}.tree .l4{padding-left:66px;font-size:12.5px;color:var(--mut)}
.tree div.n{cursor:pointer}.tree .ic{font-size:11px;color:var(--mut);white-space:nowrap}.tree .tw{display:inline-block;width:12px;color:var(--mut)}
.tree .x{display:block;margin:2px 8px 8px 30px;padding:8px 10px;border-left:3px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;font-size:13px;font-weight:400}
.x .tl{margin-top:8px;font-size:.92em}.x .tl .chip{display:inline-block;border:1px solid var(--acc);border-radius:10px;padding:1px 8px;margin:2px 2px 0 0}.x .g{white-space:pre-line;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:6px 9px;margin-bottom:6px}.x .gc{display:block;margin-top:4px}
.x .bp{margin:4px 0;padding:5px 8px;border:1px dashed var(--line);border-radius:6px}.x .cap{font-size:12px;color:var(--mut);margin:6px 0 2px}
.x table{border-collapse:collapse;font-size:12px;margin:2px 0 6px;max-width:100%}.x th,.x td{border:1px solid var(--line);padding:3px 7px;text-align:left}.x th{background:var(--acc-soft)}.x td{height:16px;color:var(--mut)}
.x .sh{font-size:11px;color:var(--mut)}.opts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:6px 0}.opts label{display:flex;gap:5px;align-items:center}
.tree .t{flex:1}.tree .s{font-size:11px;color:var(--mut);white-space:nowrap}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row .fill{flex:1 1 220px}
.mask{position:fixed;top:0;left:0;right:0;bottom:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:40;padding:12px}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(460px,100%);display:flex;flex-direction:column;gap:10px}
.dlg label{display:flex;flex-direction:column;gap:3px;font-size:13px}
.card.lock{opacity:.55;cursor:not-allowed}.card.lock:hover{border-color:var(--line)}.badge.lk{background:#b45309;color:#fff}.badge.fr{background:#2da44e;color:#fff}.licbox{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 10px;background:var(--card)}.licbox.off{border-color:#b45309}.licbox input{min-width:240px}
/* pratinjau template = detail kartu (desktop) / POPUP layar penuh (HP): daftar 1 kolom, jadi pratinjau tidak boleh nyempil di bawah daftar */
.dtop{display:flex;gap:8px;align-items:flex-start}.dtop h2{flex:1;margin:0 0 4px}.dx,.mobonly{display:none}
.dfoot{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:8px 0}
#dmask{position:fixed;top:0;left:0;right:0;bottom:0;background:#0009;z-index:25}
@media(max-width:860px){
 .dx{display:inline-block;font-size:18px;line-height:1;padding:8px 12px;border-radius:10px}.mobonly{display:inline-block}
 .detail.modal{position:fixed;left:0;right:0;bottom:0;top:28px;z-index:30;padding:0;border-radius:18px 18px 0 0;border:none;border-top:3px solid var(--acc);
  display:flex;flex-direction:column;box-shadow:0 -12px 32px rgba(0,0,0,.4)}
 .detail.modal .dtop{padding:12px 12px 8px;border-bottom:1px solid var(--line);flex:none}
 .detail.modal .dtop h2{font-size:16px;line-height:1.25}
 .detail.modal .dbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px}
 .detail.modal .tree{max-height:none;overflow:visible}
 .detail.modal .dfoot{flex:none;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
 .detail.modal .dfoot button{flex:1;padding:12px 8px}
}
</style></head><body>
<header><b>📑 Template Laporan AMDAL &amp; UKL-UPL</b><span id="who" class="mut small"></span><a href="/">← sdrive</a></header>
<main>
<div class="bar">
 <input id="q" class="q" type="search" placeholder="Cari jenis kegiatan atau topik — mis. tambang, sawit, jalan, SPBU, rumah sakit…" autofocus>
 <select id="cat"><option value="">Semua jenis kegiatan</option></select>
</div>
<div class="chips" id="kinds"></div>
<div class="bar"><button id="btTapis">🧪 Penapisan Pertek dan Andalalin</button><span class="mut small">tentukan jalur Persetujuan Teknis (kajian teknis atau standar teknis) dari pertanyaan Permen LHK 5/2021 Lampiran I dan X</span></div>
<div id="tapis" class="hide"></div>
<div id="lic"></div>
<div id="msg"></div>
<div class="layout">
 <div class="list" id="list"></div>
 <div class="detail hide" id="detail"></div>
</div>
<div id="dmask" class="hide"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const setVh=()=>document.documentElement.style.setProperty('--vh',(innerHeight*0.01)+'px');setVh();addEventListener('resize',setVh);   // unit vh di WebView APK terhitung ~0
const isMob=()=>matchMedia('(max-width:860px)').matches;
let dmPushed=false;   // tombol Back Android/browser menutup popup, bukan meninggalkan halaman
function closeDetail(fromPop){$('#detail').classList.add('hide');$('#detail').classList.remove('modal');$('#dmask').classList.add('hide');document.body.style.overflow='';
  st.cur=null;document.querySelectorAll('.card.cur').forEach(c=>c.classList.remove('cur'));
  if(dmPushed&&fromPop!==true){dmPushed=false;history.back()}else dmPushed=false}
addEventListener('popstate',()=>{if(dmPushed){dmPushed=false;closeDetail(true)}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#detail').classList.contains('hide')&&isMob())closeDetail()});
$('#dmask').onclick=()=>closeDetail();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method,path,body){
  const o={method,credentials:'same-origin',headers:{}};
  if(body!==undefined){o.body=JSON.stringify(body);o.headers={'Content-Type':'application/json'}}
  if(method!=='GET')o.headers['X-CMS']='1';
  const r=await fetch('/api'+path,o);
  if(r.status===401){location.href='/';throw new Error('belum login')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
const st={q:'',kind:'',cat:'',cur:null,min:0,me:null,lic:null,project:+(new URLSearchParams(location.search).get('project'))||0};
let timer;
function can(k){return !!(st.me&&(st.me.is_super||(st.me.perms||[]).includes(k)))}

async function boot(){
  try{st.me=(await api('GET','/me')).user}catch(e){return}
  $('#who').textContent=st.me.username;
  if(!can('template_use')){$('#msg').innerHTML='<div class="note">Akun Anda belum berhak memakai fitur Template. Minta admin mengaktifkan izin "Pakai Template Laporan" di halaman Privilege.</div>';return}
  await load();
}
function renderLic(){
  const l=st.lic,box=$('#lic');if(!l){box.innerHTML='';return}
  if(l.active){box.innerHTML=`<div class="licbox small">✅ <b>Fitur Template aktif</b>${l.activated_at?` — diaktifkan ${esc(l.activated_by||'')} · ${esc(l.activated_at.slice(0,16))}${l.payment_ref?' · ref '+esc(l.payment_ref):''}`:''}${l.forced?` <span class="mut">(dikunci operator platform: ${l.forced==='on'?'aktif':'nonaktif'})</span>`:''}
    ${l.can_manage&&!l.forced?'<button type="button" id="licOff" class="small" style="margin-left:10px">Nonaktifkan</button>':''}</div>`;
    if($('#licOff'))$('#licOff').onclick=async()=>{if(!confirm('Nonaktifkan fitur Template? Pengguna hanya bisa melihat pratinjau 3 template contoh.'))return;
      try{st.lic=(await api('POST','/templates/license',{active:false})).license;renderLic();load()}catch(e){alert(e.message)}};
    return}
  box.innerHTML=`<div class="licbox off">🔒 <b>Fitur Template belum diaktifkan.</b> Anda hanya dapat <b>melihat pratinjau ${l.demo_ids.length} template contoh</b> (bertanda “Pratinjau gratis”); template lain terkunci dan <b>tidak bisa diimpor</b> ke dokumen.
    <div class="small mut" style="margin-top:4px">Untuk membuka semua template dan mengimpor, fitur perlu <b>dibeli (pembayaran)</b> lalu <b>diaktifkan oleh operator platform</b>.</div>
    <div class="small" style="margin-top:6px">Aktivasi dilakukan oleh penyedia layanan (operator) setelah pembayaran — hubungi mereka untuk berlangganan.</div></div>`;
  if($('#licOn'))$('#licOn').onclick=async()=>{const ref=$('#licRef').value.trim();if(ref.length<3)return alert('Isi referensi pembayaran dulu.');
    if(!confirm('Aktifkan fitur Template? Pastikan pembayaran sudah terkonfirmasi.'))return;
    try{st.lic=(await api('POST','/templates/license',{active:true,payment_ref:ref})).license;renderLic();load();if(st.cur)open(st.cur)}catch(e){alert(e.message)}};
}
async function load(){
  const p=new URLSearchParams({q:st.q,kind:st.kind,category:st.cat});
  let r;try{r=await api('GET','/templates?'+p)}catch(e){$('#msg').innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  st.lic=r.license;renderLic();
  if(!$('#kinds').children.length){
    $('#kinds').innerHTML=[{key:'',label:'Semua dokumen'},...r.kinds].map(k=>`<button class="chip" data-k="${esc(k.key)}">${esc(k.label)}</button>`).join('');
    $('#cat').innerHTML='<option value="">Semua jenis kegiatan</option>'+r.categories.map(c=>`<option value="${esc(c.key)}">${esc(c.label)}</option>`).join('');
  }
  document.querySelectorAll('#kinds .chip').forEach(b=>b.classList.toggle('cur',b.dataset.k===st.kind));
  $('#msg').innerHTML=r.total?'':'<div class="note">Katalog template belum dibangun di server ini (jalankan <code>scripts/tpl_build.py</code>).</div>';
  $('#list').innerHTML=r.items.map(t=>`<div class="card${st.cur===t.id?' cur':''}${t.locked?' lock':''}" data-id="${esc(t.id)}" data-lock="${t.locked?1:''}"><b>${t.locked?'🔒 ':''}${esc(t.title)}</b>
   <div class="meta">${t.locked?'<span class="badge lk">Terkunci</span>':(st.lic&&!st.lic.active?'<span class="badge fr">Pratinjau gratis</span>':'')}<span class="badge">${esc(t.kind_label)}</span><span class="badge">${t.n_chapters} bab · ${t.n_nodes} bagian</span>
   <span class="badge ${t.source==='konsensus'?'gr':''}">${t.source==='aturan'?'sesuai aturan (PP 22/2021)':t.source==='baku'?'kerangka baku':'konsensus '+t.n_docs+' dokumen'}</span></div></div>`).join('')
   ||'<p class="mut">Tidak ada template yang cocok. Coba kata kunci lain (mis. “tambang”, “jalan”, “pabrik”).</p>';
  if(!st.cur&&r.items.length&&r.items.length<=1&&!isMob())open(r.items[0].id);
}
const TP={jalur:'badan_air',kbli:'',jawab:{},res:null,kb:null,err:''};
const TPJ=[['badan_air','Air limbah → badan air permukaan'],['formasi_pembuangan','Air limbah → formasi tertentu (injeksi)'],['aplikasi_tanah','Pemanfaatan → aplikasi ke tanah'],['formasi_pemanfaatan','Pemanfaatan → formasi tertentu (imbuhan/resapan)'],['laut','Air limbah → laut'],['emisi','Emisi sumber tidak bergerak'],['andalalin','Andalalin (analisis dampak lalu lintas, PM 17/2021)']];
async function tpRun(){
  if(TP.jalur==='andalalin')return tpAlRun();
  TP.err='';
  try{TP.res=await api('POST','/templates/pertek/tapis',{jalur:TP.jalur,jawaban:TP.jawab,kbli:TP.kbli})}catch(e){TP.res=null;TP.err=e.message}
  tpDraw();
}
async function tpKbli(){
  TP.err='';TP.kb=null;
  try{TP.kb=await api('GET','/templates/pertek/kbli?q='+encodeURIComponent(TP.kbli))}catch(e){TP.err=e.message}
  tpDraw();
}
function tpDraw(){
  if(TP.jalur==='andalalin')return tpAlDraw();
  const r=TP.res,box=$('#tapis');
  const ans=(k,v)=>`<button data-k="${esc(k)}" data-v="${v}" class="${TP.jawab[k]===v?'p':''}">${v==='ya'?'Ya':'Tidak'}</button>`;
  let h=`<div class="detail" style="position:static;margin-bottom:12px"><h2>Penapisan mandiri Persetujuan Teknis</h2>
   <div class="small mut">Bantuan penapisan awal; keputusan akhir tetap pada penanggung jawab dan instansi. Status berlaku peraturan belum diverifikasi.</div>
   <div class="row" style="margin-top:8px"><select id="tpJ">${TPJ.map(j=>`<option value="${j[0]}" ${TP.jalur===j[0]?'selected':''}>${esc(j[1])}</option>`).join('')}</select>
   <input id="tpK" class="fill" placeholder="Kode KBLI (mis. 10130) — opsional" value="${esc(TP.kbli)}"><button id="tpCari">Cari KBLI</button></div>`;
  if(TP.err)h+=`<div class="err" style="margin-top:6px">${esc(TP.err)}</div>`;
  if(TP.kb){
    h+=`<div class="note" style="margin-top:8px"><b>KBLI ${esc(TP.kb.kode)}</b><br>`+Object.values(TP.kb.daftar).map(d=>`${d.cocok.length?'✅':'▫️'} ${esc(d.judul)}: ${d.cocok.length?d.cocok.map(x=>esc(x.kbli+' '+x.nama)).join('; '):'tidak ada'}${!d.cocok.length&&d.n_mungkin?` <span class="mut">(kode lebih rinci: ${d.n_mungkin} baris)</span>`:''}`).join('<br>')+`</div>`;
  }
  if(r){
    const qs=(r.langkah||[]).map(s=>`<div class="small">• ${esc(s.pertanyaan)} <b>${esc(s.jawab)}</b></div>`).join('');
    h+=`<div style="margin-top:8px">${qs}</div>`;
    (r.peringatan||[]).forEach(p=>h+=`<div class="small mut">ℹ️ ${esc(p)}</div>`);
    if(TP.jalur==='emisi'){
      h+=`<div class="row" style="margin-top:8px"><span>Baku Mutu Emisi sudah ditetapkan Pemerintah?</span>${ans('bme_ditetapkan','ya')}${ans('bme_ditetapkan','tidak')}</div>
      <div class="row" style="margin-top:6px"><span>Lokasi pada WPPMU kelas I? (informasi)</span>${ans('wppmu_kelas_i','ya')}${ans('wppmu_kelas_i','tidak')}</div>`;
    }else if(!r.selesai&&r.berikut){
      h+=`<div style="margin-top:10px"><b>${esc(r.berikut.pertanyaan)}</b><div class="row" style="margin-top:6px">${ans(r.berikut.kunci,'ya')}${ans(r.berikut.kunci,'tidak')}</div></div>`;
    }
    if(r.selesai&&r.hasil){
      const x=r.hasil;
      h+=`<div class="note" style="margin-top:10px;background:var(--acc-soft);color:var(--fg)"><b>${esc(x.judul)}</b><div class="small mut">${esc(r.dasar||'')}</div>`
        +(x.ketentuan||[]).map(k=>`<div class="small">• ${esc(k)}</div>`).join('')
        +((x.template||[]).length?`<div style="margin-top:6px">Template: `+x.template.map(t=>t.ada?`<a href="#" data-t="${esc(t.id)}">${esc(t.title)}</a>`:esc(t.title)).join(' · ')+`</div>`:'')+`</div>`;
    }
    if(Object.keys(TP.jawab).length)h+=`<div style="margin-top:8px"><button id="tpUlang">Ulangi dari awal</button></div>`;
  }
  box.innerHTML=h+'</div>';
  $('#tpJ').onchange=e=>{TP.jalur=e.target.value;TP.jawab={};TP.res=null;tpRun()};
  $('#tpK').oninput=e=>{TP.kbli=e.target.value.trim()};
  $('#tpK').onchange=()=>tpRun();
  $('#tpCari').onclick=()=>{tpKbli();tpRun()};
  box.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{TP.jawab[b.dataset.k]=b.dataset.v;tpRun()});
  box.querySelectorAll('a[data-t]').forEach(a=>a.onclick=e=>{e.preventDefault();open(a.dataset.t);$('#detail').scrollIntoView({behavior:'smooth'})});
  const u=$('#tpUlang');if(u)u.onclick=()=>{TP.jawab={};TP.res=null;TP.kb=null;tpRun()};
}
const AL={jenis:'',besaran:'',jam:'',hari:'',peng:'',ubah:false,akses:false,baru:false,status:[],list:null,res:null,err:''};
const ALST=[['nasional','nasional'],['provinsi','provinsi'],['kabupaten','kabupaten'],['desa','desa'],['kota','kota']];
async function tpAlRun(){
  AL.err='';
  try{
    if(!AL.list)AL.list=(await api('GET','/templates/andalalin/jenis')).jenis;
    if(AL.jenis||AL.jam||AL.hari||AL.ubah||AL.peng){
      AL.res=await api('POST','/templates/andalalin/tapis',{jenis:AL.jenis,besaran:AL.besaran,jam:AL.jam,hari:AL.hari,pengembangan_pct:AL.peng,ubah_fungsi:AL.ubah,
        akses_jalan_eksisting:AL.akses,infrastruktur_lain_jalan_baru:AL.baru,status_jalan:AL.status});
    }else AL.res=null;
  }catch(e){AL.res=null;AL.err=e.message}
  tpAlDraw();
}
function tpAlDraw(){
  const box=$('#tapis'),L=AL.list||[],j=L.find(x=>x.id===AL.jenis),r=AL.res;
  const grp={};L.forEach(x=>{(grp[x.kelompok]=grp[x.kelompok]||[]).push(x)});
  let h=`<div class="detail" style="position:static;margin-bottom:12px"><h2>Penapisan Andalalin (PM 17/2021)</h2>
   <div class="small mut">Kriteria ukuran Lampiran I dan pemicu Pasal 7-9. Bantuan penapisan awal; keputusan akhir pada instansi perhubungan. Status berlaku peraturan belum diverifikasi.</div>
   <div class="row" style="margin-top:8px"><select id="tpJ">${TPJ.map(x=>`<option value="${x[0]}" ${TP.jalur===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div>
   <div class="row" style="margin-top:8px"><select id="alJ" class="fill"><option value="">— pilih jenis rencana pembangunan —</option>${Object.keys(grp).map(k=>`<optgroup label="${esc(k)}">${grp[k].map(x=>`<option value="${esc(x.id)}" ${AL.jenis===x.id?'selected':''}>${esc(x.no+' '+x.nama)}</option>`).join('')}</optgroup>`).join('')}</select>
   ${j&&j.bentuk==='ukuran'?`<input id="alB" type="number" min="0" step="any" placeholder="${esc(j.satuan)}" value="${esc(AL.besaran)}">`:''}</div>
   <div class="row" style="margin-top:6px"><input id="alJam" type="number" min="0" step="any" placeholder="Perjalanan terhitung per jam (opsional)" value="${esc(AL.jam)}" class="fill"><input id="alHr" type="number" min="0" step="any" placeholder="per hari (opsional)" value="${esc(AL.hari)}" class="fill"></div>
   <div class="row" style="margin-top:6px"><input id="alPg" type="number" min="0" step="any" placeholder="Pengembangan (% dari kondisi awal/fasilitas utama)" value="${esc(AL.peng)}" class="fill"></div>
   <div class="opts"><label><input type="checkbox" id="alUb" ${AL.ubah?'checked':''}> perubahan fungsi peruntukan bangunan</label><label><input type="checkbox" id="alAk" ${AL.akses?'checked':''}> infrastruktur lain: akses dari/ke jalan eksisting</label><label><input type="checkbox" id="alBr" ${AL.baru?'checked':''}> infrastruktur lain: menghubungkan jalan yang belum pernah ada</label></div>
   <div class="opts"><span class="mut">Status jalan terpengaruh:</span>${ALST.map(s=>`<label><input type="checkbox" data-st="${s[0]}" ${AL.status.includes(s[0])?'checked':''}> ${s[1]}</label>`).join('')}</div>`;
  if(AL.err)h+=`<div class="err">${esc(AL.err)}</div>`;
  if(r){
    h+=`<div class="note" style="background:var(--acc-soft);color:var(--fg)"><b>${r.wajib?'Wajib Andalalin':'Belum wajib menurut ukuran Lampiran I'}${r.dokumen?' — '+esc(r.dokumen)+' ('+esc(r.kategori_nama)+')':''}</b>`
      +(r.langkah||[]).map(x=>`<div class="small">• ${esc(x)}</div>`).join('')+(r.pemicu||[]).map(x=>`<div class="small">⚑ ${esc(x)}</div>`).join('')+(r.pengecualian||[]).map(x=>`<div class="small">⚐ ${esc(x)}</div>`).join('')
      +(r.kewajiban||[]).map(x=>`<div class="small mut">${esc(x)}</div>`).join('')
      +(r.kewenangan?`<div class="small" style="margin-top:4px">Persetujuan oleh: <b>${esc(r.kewenangan.pemberi)}</b> (${esc(r.kewenangan.dasar)}) ${(r.kewenangan.catatan||[]).map(esc).join(' ')}</div>`:'')
      +((r.template||[]).length?`<div style="margin-top:6px">Template: `+r.template.map(t=>t.ada?`<a href="#" data-t="${esc(t.id)}">${esc(t.title)}</a>`:esc(t.title)).join(' · ')+`</div>`:'')+`</div>`;
  }
  box.innerHTML=h+'</div>';
  $('#tpJ').onchange=e=>{TP.jalur=e.target.value;TP.jawab={};TP.res=null;tpRun()};
  const g=(id,k,num)=>{const el=$(id);if(el)el.onchange=e=>{AL[k]=e.target.value;tpAlRun()}};
  g('#alJ','jenis');g('#alB','besaran');g('#alJam','jam');g('#alHr','hari');g('#alPg','peng');
  $('#alUb').onchange=e=>{AL.ubah=e.target.checked;tpAlRun()};$('#alAk').onchange=e=>{AL.akses=e.target.checked;tpAlRun()};$('#alBr').onchange=e=>{AL.baru=e.target.checked;tpAlRun()};
  box.querySelectorAll('input[data-st]').forEach(c=>c.onchange=()=>{AL.status=[...box.querySelectorAll('input[data-st]:checked')].map(x=>x.dataset.st);tpAlRun()});
  box.querySelectorAll('a[data-t]').forEach(a=>a.onclick=e=>{e.preventDefault();open(a.dataset.t);$('#detail').scrollIntoView({behavior:'smooth'})});
}
$('#btTapis').onclick=()=>{const b=$('#tapis');b.classList.toggle('hide');if(!b.classList.contains('hide'))tpRun()};
$('#kinds').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;st.kind=b.dataset.k;load()};
$('#cat').onchange=e=>{st.cat=e.target.value;load()};
$('#q').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{st.q=e.target.value.trim();load()},200)};
$('#list').onclick=e=>{const c=e.target.closest('.card');if(!c)return;if(c.dataset.lock){$('#msg').innerHTML='<div class="note">🔒 Template ini terkunci. Aktifkan fitur Template (pembelian + aktivasi oleh operator) untuk membuka semua template dan mengimpor.</div>';return}$('#msg').innerHTML='';open(c.dataset.id)};

let TOOLS={};
function htHtml(n){return (n.ht||[]).length?`<div class="tl">📊 <b>Di dokumen contoh sejenis, bagian ini memuat perhitungan:</b> ${n.ht.map(h=>TOOLS[h.tool]?`<span class="chip" title="${esc(TOOLS[h.tool].why)}">${TOOLS[h.tool].icon} ${esc(TOOLS[h.tool].label)} <span class="sh">· ${h.n} dari ${h.of} dokumen</span></span>`:'').join(' ')}</div>`:''}
function toolsHtml(n){return (n.tools||[]).length?`<div class="tl">🧮 <b>Terkait mesin hitung/simulasi:</b> ${n.tools.map(id=>TOOLS[id]?`<span class="chip" title="${esc(TOOLS[id].why)}">${TOOLS[id].icon} ${esc(TOOLS[id].label)}</span>`:'').join(' ')}<div class="small mut">Setelah disalin, tombol “🧮 Hitung / simulasikan…” muncul di bagian ini pada editor dan hasilnya bisa disisipkan sebagai blok.</div></div>`:''}
function blocksHtml(n){
  const g=n.g?`<div class="g">💡 ${esc(n.g)}${n.gc?`<span class="gc"><b>Untuk jenis kegiatan ini:</b> ${esc(n.gc)}</span>`:''}</div>`:'';
  const bl=(n.b||[]).map(b=>{
    if(b.k==='p')return `<div class="bp">${esc(b.t)} <span class="sh">· teks baku ${b.s}%</span></div>`;
    if(b.k==='kv')return `<div class="cap">Tabel isian <span class="sh">· ${b.s}%</span></div><table>${b.labels.map((l,i)=>`<tr><td>${i+1}.</td><td>${esc(l)}</td><td>:</td><td></td></tr>`).join('')}</table>`;
    return `${b.cap?`<div class="cap">Tabel: ${esc(b.cap)} <span class="sh">· ${b.s}%</span></div>`:`<div class="cap">Kerangka tabel <span class="sh">· ${b.s}%</span></div>`}
      <table>${b.h.map(r=>`<tr>${r.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}<tr>${b.h[0].map(()=>'<td></td>').join('')}</tr></table>`;
  }).join('');
  return g+bl+htHtml(n)+toolsHtml(n)||'<span class="mut">Belum ada petunjuk atau contoh isi untuk bagian ini.</span>';
}
async function open(id){
  st.cur=id;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('cur',c.dataset.id===id));
  let r;try{r=await api('GET',`/templates/${encodeURIComponent(id)}?min_share=${st.min}`)}catch(e){$('#msg').innerHTML=`<div class="err">${esc(e.message)}</div>`;return}
  const t=r.template,base=t.source==='baku';TOOLS=r.tools||{};
  const nG=t.nodes.filter(n=>n.g).length,nB=t.nodes.reduce((a,n)=>a+(n.b||[]).length,0);
  const keepSc=$('.dbody')?$('.dbody').scrollTop:0;
  $('#detail').classList.remove('hide');
  $('#detail').innerHTML=`<div class="dtop"><h2>${esc(t.title)}</h2><button type="button" class="dx" id="dclose" aria-label="Tutup">✕</button></div>
   <div class="dbody"><div class="mut small">${base?'Kerangka lazim (arsip hanya memuat formulir isian, bukan naskah KA) — cocokkan dengan format dalam peraturan yang berlaku.':
    `Outline konsensus dari <b>${t.n_docs}</b> dokumen contoh yang sudah diajukan — hanya bagian yang lazim muncul. Angka % = porsi contoh yang memuat bagian itu.`}</div>
   ${base?'':`<div class="row" style="margin-top:8px"><label class="small fill">Kerincian: <b id="mv">${st.min===0?'lengkap':'hanya yang ≥ '+st.min+'%'}</b>
    <input id="min" type="range" min="0" max="90" step="5" value="${st.min}" style="width:100%"></label></div>`}
   <div class="row small mut" style="margin-top:6px"><span class="fill">Klik sebuah bagian untuk melihat 💡 petunjuk dan 📝 contoh isinya (${nG} bagian berpetunjuk, ${nB} blok contoh).</span>
    <button type="button" id="ex" class="small">Buka semua</button></div>
   <div class="tree">${t.nodes.map((n,i)=>`<div class="n l${n.l}" data-i="${i}"><span class="tw">▸</span><span class="t">${esc(n.t)}</span>
     <span class="ic">${(n.tools||[]).length?'🧮 ':''}${n.g?'💡':''}${(n.b||[]).length?' 📝'+n.b.length:''}</span>${n.s<100?`<span class="s">${n.s}%</span>`:''}</div>
     <div class="x hide" id="x${i}">${blocksHtml(n)}</div>`).join('')}</div>
   <div class="mut small" style="margin:6px 0">${t.nodes.length} bagian${t.n_nodes_all>t.nodes.length?' (dari '+t.n_nodes_all+')':''} — setelah disalin, semuanya blok biasa: edit, geser, atau hapus di editor.</div>
   ${st.lic&&!st.lic.active?'<div class="note">Ini pratinjau contoh. Mengimpor template ke dokumen memerlukan fitur Template yang aktif (pembelian + aktivasi oleh operator).</div>':''}
   <div class="note">${esc(r.disclaimer||'Template hanya kerangka dan contoh isi; penyusun tetap wajib menyesuaikan dengan peraturan yang berlaku dan karakter rencana kegiatan.')} Teks contoh disusun dari pola dokumen yang sudah diajukan; nama pemrakarsa &amp; wilayah diganti placeholder <code>[…]</code>.</div></div>
   <div class="dfoot"><button type="button" class="mobonly" id="dback">← Pilih contoh lain</button>
   ${st.lic&&!st.lic.active?'<button class="p" id="cp" disabled title="Impor terkunci sampai fitur diaktifkan">🔒 Impor terkunci</button>':'<button class="p" id="cp" title="Buat dokumen baru berisi outline + petunjuk penulisan tiap bagian">📥 Salin outline &amp; petunjuk</button>'}</div>`;
  if(isMob()){$('#detail').classList.add('modal');$('#dmask').classList.remove('hide');document.body.style.overflow='hidden';if(!dmPushed){history.pushState({dm:1},'');dmPushed=true}}
  if(keepSc&&$('.dbody'))$('.dbody').scrollTop=keepSc;
  $('#dclose').onclick=()=>closeDetail();$('#dback').onclick=()=>closeDetail();
  const rg=$('#min');if(rg){rg.oninput=()=>{st.min=+rg.value;$('#mv').textContent=st.min===0?'lengkap':'hanya yang ≥ '+st.min+'%'};rg.onchange=()=>open(id)}
  const tog=(i,on)=>{const x=$('#x'+i);if(!x)return;x.classList.toggle('hide',on===undefined?!x.classList.contains('hide'):!on);
    const row=document.querySelector(`.tree .n[data-i="${i}"] .tw`);if(row)row.textContent=x.classList.contains('hide')?'▸':'▾'};
  $('.tree').onclick=e=>{const n=e.target.closest('.n');if(n)tog(n.dataset.i)};
  let allOpen=false;$('#ex').onclick=()=>{allOpen=!allOpen;t.nodes.forEach((_,i)=>tog(i,allOpen));$('#ex').textContent=allOpen?'Tutup semua':'Buka semua'};
  if(!$('#cp').disabled)$('#cp').onclick=()=>copyDlg(t);
}
async function copyDlg(t){
  let projects=[];
  if(can('project_manage')){try{projects=(await api('GET','/projects')).projects}catch(e){}}
  const m=document.createElement('div');m.className='mask';
  m.innerHTML=`<form class="dlg"><b>Salin “${esc(t.title)}”</b>
   <label>Judul dokumen<input name="title" value="${esc(t.title)}" required maxlength="200"></label>
   ${projects.length?`<label>Tautkan ke proyek (opsional)<select name="pid"><option value="">— jangan, dokumen berdiri sendiri —</option>${projects.map(p=>`<option value="${p.id}"${p.id===st.project?' selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
   <label>Jenis laporan<select name="rt"><option value="draft">Draft</option><option value="interim">Interim</option><option value="final">Final</option></select></label>`:''}
   <div class="opts"><label><input type="checkbox" name="gd" checked> Sertakan 💡 petunjuk (catatan di bawah tiap judul)</label>
    <label><input type="checkbox" name="ct" checked> Sertakan 📝 teks baku &amp; kerangka tabel</label></div>
   <span class="small mut">Dibuat dokumen baru berisi ${t.nodes.length} judul bagian. Catatan petunjuk tidak ikut ekspor DOCX (bisa diubah di Opsi ekspor dokumen). Anda otomatis jadi pengunggahnya.</span>
   <div class="row" style="justify-content:flex-end"><button type="button" id="x">Batal</button><button class="p">Salin</button></div><span class="err small" id="e"></span></form>`;
  document.body.append(m);const f=m.querySelector('form');m.querySelector('#x').onclick=()=>m.remove();
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button.p');b.disabled=true;
    try{const r=await api('POST',`/templates/${encodeURIComponent(t.id)}/copy`,{title:f.title.value,min_share:st.min,include_guide:f.gd.checked,include_content:f.ct.checked,
        project_id:f.pid&&f.pid.value?+f.pid.value:undefined,report_type:f.rt?f.rt.value:undefined});
      location.href='/?doc='+r.doc_id;
    }catch(x){m.querySelector('#e').textContent=x.message;b.disabled=false}};
}
boot();
</script></body></html>
