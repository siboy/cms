<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toko Alat Hitung — sdrive</title>
<link rel="icon" href="/app-icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f7f9;--fg:#1F2937;--mut:#64748b;--line:#e2e7ef;--card:#fff;--acc:#7c3aed;--mint:#A8E6CF;--lilac:#D8B4F8;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--warn-bg:#fef3c7;--soft:#f3ecfd}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e6e9ee;--mut:#8d97a9;--line:#2a3140;--card:#1a1f29;--acc:#b794f6;--ok:#4ade80;--bad:#f87171;--warn:#f0a35e;--warn-bg:#3a2a12;--soft:#2a2340}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:3px solid var(--mint);background:var(--card);position:sticky;top:0;z-index:5}
header b{flex:1;font-size:16px}a{color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:12px 12px 120px}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
button.p{background:linear-gradient(90deg,var(--lilac),var(--mint));color:#1F2937;border:none;font-weight:700}
button.d{color:var(--bad);border-color:var(--bad)}
.tabs{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto}.tabs button{border-radius:999px;white-space:nowrap}.tabs button.cur{background:var(--soft);border-color:var(--acc);color:var(--acc);font-weight:700}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;margin:8px 0;font-size:13px}
.ok{color:var(--ok)}.err{color:var(--bad)}.mut{color:var(--mut)}.small{font-size:12px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;border-top:4px solid var(--mint)}
.card.hl{border-color:var(--acc);box-shadow:0 0 0 2px var(--soft)}
.card h3{margin:0 0 2px;font-size:15px}.card p{margin:2px 0 8px}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:2px 3px 0 0;background:var(--bg)}
.badge{display:inline-block;font-size:11px;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--acc);font-weight:700;margin:2px 4px 2px 0}
.badge.g{background:#15803d22;color:var(--ok)}.badge.disc{background:linear-gradient(90deg,#fecaca,#fde68a);color:#7f1d1d}.pr s{color:var(--mut);font-weight:400;font-size:12px;margin-right:4px}.grp{font-size:11px;color:var(--mut);margin-bottom:2px}.badge.l{background:var(--warn-bg);color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>.fill{flex:1 1 160px}
.opt{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:10px;margin:5px 0;cursor:pointer}
.opt input{width:18px;height:18px;padding:0;flex:none}.opt .pr{margin-left:auto;font-weight:700;white-space:nowrap}
.opt.na{opacity:.5;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--mint);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:6;box-shadow:0 -8px 22px rgba(0,0,0,.15)}
.bar .tot{flex:1}.hide{display:none!important}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top;font-size:13px}th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
.mask{position:fixed;top:0;left:0;right:0;bottom:0;background:#0009;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:min(560px,100%);max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;border-top:3px solid var(--mint);padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:block}
.dlg>*{display:block;margin:0 0 9px}.dlg label{font-weight:700;font-size:13px}.dlg label>input,.dlg label>select,.dlg label>textarea{width:100%;font-weight:400;margin-top:3px}
.dlg .row{display:flex}
h4{margin:14px 0 6px}
</style></head><body>
<header><a id="backTop" class="hide" href="#" style="font-weight:700;white-space:nowrap">← Kembali ke laporan</a><b>🛒 Toko Alat Hitung &amp; Simulasi</b><span id="who" class="mut small"></span><a href="/">← sdrive</a></header>
<main>
 <div id="msg"></div>
 <div class="tabs" id="tabs"></div>
 <div id="view"></div>
</main>
<div class="bar hide" id="cartbar"><div class="tot"><b id="ccount"></b><div class="small mut" id="ctotal"></div></div><button type="button" id="cclear">Kosongkan</button><button type="button" class="p" id="cgo">Checkout</button></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>n==null?'—':'Rp '+Number(n).toLocaleString('id-ID');
const dt=s=>(s||'').slice(0,10);
const QS=new URLSearchParams(location.search);
async function api(method,path,body){
  const o={method,credentials:'same-origin',headers:{}};
  if(body!==undefined){o.body=JSON.stringify(body);o.headers={'Content-Type':'application/json'}}
  if(method!=='GET')o.headers['X-CMS']='1';
  const r=await fetch('/api/license'+path,o);
  if(r.status===401){location.href='/';throw new Error('belum login')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
/* BACK = tautan dalam ke posisi editor asal (hanya jalur relatif satu-situs). buy=1 = alur beli langsung satu alat */
const BACK=(b=>/^\/(?!\/)/.test(b)?b:'')(QS.get('back')||'');
const backTo=flag=>{if(!BACK)return false;location.href=BACK+(flag?'&bought='+flag:'');return true};
const S={direct:false,buy:!!BACK&&QS.get('buy')==='1'&&!!(QS.get('engine')||QS.get('item')),d:null,tab:'toko',cart:[],hold:{type:'user',id:null},doc:+QS.get('doc')||0,hl:QS.get('engine')||QS.get('item')||'',lic:[],ord:[],adm:null};
const ALLI=()=>S.d.engines.concat(S.d.tpl_items||[]);
const LBL=k=>((ALLI().find(e=>e.key===k)||{}).label)||((S.d.labels||{})[k])||k;
const note=(t,bad)=>{$('#msg').innerHTML=t?`<div class="note" style="${bad?'':'background:#15803d22;color:var(--ok)'}">${esc(t)}</div>`:'';if(t)window.scrollTo({top:0,behavior:'smooth'})};

async function boot(){
  try{S.d=await api('GET','/store'+(S.doc?'?doc='+S.doc:''))}catch(e){return note(e.message,1)}
  $('#who').textContent=S.d.me.username;
  if(!S.doc&&S.d.docs[0])S.docSel=S.d.docs[0].id;S.docSel=S.doc||S.docSel||0;
  S.hold={type:'user',id:S.d.me.id};
  if(BACK){const a=$('#backTop');a.href=BACK;a.classList.remove('hide')}
  tabs();draw();cartBar();
}
function tabs(){$('#tabs').innerHTML=''}      // tenant hanya punya halaman Toko; Lisensi/Pesanan/Admin ada di cmspanel (superadmin platform)
function draw(){viewToko();cartBar()}

// ------------------------------------------------------------------------------- TOKO
function ownBadges(e){
  let h='';
  if(e.operator)h+='<span class="badge g">✅ Dibuka operator (semua pengguna)</span>';
  if(e.owned)h+=`<span class="badge g">✅ Aktif s.d. ${esc(dt(e.owned.ends_at))}${e.owned.holder_type!=='user'?' ('+(e.owned.holder_type==='group'?'lewat grup':'seluruh tenant')+')':''}</span>`;
  if(e.owned_here)h+='<span class="badge g">✅ Dapat dipakai di laporan ini</span>';
  (e.report_licenses||[]).slice(0,3).forEach(r=>{h+=`<span class="badge g" title="${esc(r.doc_title||'')}">📄 Laporan: ${esc((r.doc_title||'#'+r.doc_id).slice(0,28))}</span>`});
  if((e.report_licenses||[]).length>3)h+=`<span class="badge g">+${e.report_licenses.length-3} laporan lain</span>`;
  if(e.pending_order)h+=`<span class="badge l">⏳ Pesanan #${e.pending_order} menunggu pembayaran</span>`;
  if(!h)h='<span class="badge l">🔒 Terkunci</span>';
  return h;
}
function viewToko(){
  const d=S.d;let h='';S.hold={type:'user',id:d.me.id};
  if(S.buy&&!ALLI().some(e=>e.key===S.hl))S.buy=false;
  const only=S.buy?ALLI().filter(e=>e.key===S.hl):d.engines;
  if(S.buy&&only.length){S.docSel=S.doc||S.docSel;
    h+=`<div class="note" style="background:var(--soft);color:var(--acc)">⚡ <b>Beli langsung</b> — pilih paket, bayar, lalu Anda otomatis kembali ke bagian laporan tadi. <a href="#" id="allTools">Lihat semua alat</a></div>`;
  }else if(!d.licensing)h+=`<div class="note">Mode lisensi per-alat <b>belum aktif</b> di tenant ini, sehingga akses alat mengikuti pengaturan operator platform.</div>`;
  const pend=d.pending_orders||[];
  if(pend.length)h+=`<div class="card" style="margin-bottom:10px;border-color:var(--warn)"><b>⏳ Pesanan menunggu pembayaran</b>${pend.map(o=>`<div class="row"><span class="small"><b>${esc(o.code)}</b> · ${rp(o.total)} · ${o.items.map(k=>esc(LBL(k))).join(', ')}</span>${o.verify_state==='manual'?'<span class="badge l">🔎 butuh verifikasi manual — operator akan menghubungi Anda</span>':`<button type="button" class="p small" data-pay="${o.id}">💳 Bayar / unggah bukti</button>`}<button type="button" class="d small" data-cancel="${o.id}">Batalkan</button></div>`).join('')}</div>`;
  if(!S.buy)h+=`<div class="card" style="margin-bottom:10px"><b>📑 Template outline laporan</b> <span class="small mut">— dijual per outline: <b>${rp(d.tpl_price)}</b> untuk <b>sekali impor</b> ke dokumen baru (tiap impor bayar lagi). Beli lewat halaman <a href="/templates">Template</a> (ada tombol “⚡ Beli langsung” di tiap template).</span></div>`;
  if(!S.buy)h+=`<div class="card" style="margin-bottom:10px"><b>Cara kerja</b>
   <div class="small mut">Tiap alat hitung/simulasi dibeli terpisah dengan harga sendiri (sesuai kesulitan hitung dan hasil yang ditawarkan). Pilih <b>Paket waktu</b> (berlaku untuk semua laporan selama 6/12/24 bulan) atau <b>Sekali pakai per laporan</b> (hanya untuk satu laporan; laporan lain harus beli lagi).
   Admin dapat membelikan untuk Anda, grup, atau seluruh tenant. Judul bagian, petunjuk, dan penanda 🧮 di dokumen tetap terlihat; yang terkunci hanya pemakaian hitung/simulasinya.</div></div>`;
  if(!S.buy)h+=`<div class="row">
   <label class="fill small"><b>Laporan (utk paket per-laporan)</b><br><select id="docSel">${d.docs.length?d.docs.map(x=>`<option value="${x.id}" ${x.id===S.docSel?'selected':''}>${esc(x.title)}</option>`).join(''):'<option value="">(belum ada laporan)</option>'}</select></label></div>`;
  h+='<div class="grid">'+only.map(e=>{
    if(e.feat)return `<div class="card hl" id="c_${esc(e.key)}"><div class="grp">${esc(e.group)}</div><h3>${e.icon} ${esc(e.label)}</h3>
     <div>${e.active?`<span class="badge g">✅ Aktif s.d. ${esc(dt(e.ends_at))}</span>`:'<span class="badge l">🔒 Belum aktif</span>'}</div><p class="small mut">${esc(e.desc)}</p>
     ${e.can_buy?`<label class="opt"><input type="radio" name="o_${esc(e.key)}" value="feat" checked><span>⭐ Langganan ${e.months} bulan — seluruh perusahaan</span><span class="pr">${rp(e.price)}</span></label>
     <div class="small mut" style="margin:4px 0">Nominal besar: setelah bukti diunggah, aktivasi dikonfirmasi operator platform.</div>
     <div class="row"><button type="button" class="p now" data-k="${esc(e.key)}">⚡ ${e.active?'Perpanjang':'Beli langsung'}</button></div>`:'<div class="note">Hanya admin dengan izin “Beli Fitur Premium Perusahaan” yang bisa membeli.</div>'}</div>`;
    if(e.tpl)return `<div class="card hl" id="c_${esc(e.key)}"><div class="grp">${esc(e.group)}</div><h3>${e.icon} ${esc(e.label)}</h3>
     <div>${e.credits?`<span class="badge g">🎟 ${e.credits} kali impor tersedia</span>`:'<span class="badge l">🔒 Belum dibeli</span>'}</div><p class="small mut">${esc(e.desc)}</p>
     <label class="opt"><input type="radio" name="o_${esc(e.key)}" value="copy" checked><span>📥 Sekali impor — 1 dokumen</span><span class="pr">${rp(e.price)}</span></label>
     <div class="row"><button type="button" class="p now" data-k="${esc(e.key)}">⚡ Beli langsung</button></div></div>`;
    const p=e.prices,lp=e.list_prices,has=['6','12','24','report'].some(k=>p[k]!=null);
    const opt=(k,l,val)=>p[k]==null?`<div class="opt na"><input type="radio" disabled><span>${l}</span><span class="pr mut">belum dihargai</span></div>`
      :`<label class="opt"><input type="radio" name="o_${e.key}" value="${val}"><span>${l}</span><span class="pr">${e.discount_pct&&lp[k]!=null&&lp[k]!==p[k]?`<s>${rp(lp[k])}</s>`:''}${rp(p[k])}</span></label>`;
    return `<div class="card ${S.hl===e.key?'hl':''}" id="c_${e.key}"><div class="grp">${esc(e.group)}</div><h3>${e.icon} ${esc(e.label)}</h3><div>${e.discount_pct?`<span class="badge disc">🏷 Diskon ${e.discount_pct}%</span>`:''}${ownBadges(e)}</div><p class="small mut">${esc(e.desc)}</p>
     <div><span class="chip">${e.n_formulas} rumus</span><span class="chip">${e.n_params} parameter</span>${e.sim?'<span class="chip">🎞 simulasi 2-D</span>':''}</div>
     ${has?opt('report','📄 Sekali pakai — 1 laporan','report')+opt('6','Paket 6 bulan (semua laporan)','6')+opt('12','Paket 12 bulan (semua laporan)','12')+opt('24','Paket 24 bulan (semua laporan)','24')
        +`<div class="row"><button type="button" class="p now" data-k="${e.key}">⚡ Beli langsung</button>${S.buy?'':`<button type="button" class="add" data-k="${e.key}">＋ Keranjang</button>`}</div>`
       :`<div class="note">Harga belum ditetapkan oleh operator platform.</div>`}</div>`}).join('')+'</div>';
  $('#view').innerHTML=h;
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>openPay(b.dataset.pay));
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{if(!confirm('Batalkan pesanan ini?'))return;try{await api('POST',`/orders/${b.dataset.cancel}/cancel`);await boot()}catch(e){note(e.message,1)}});
  if($('#docSel'))$('#docSel').onchange=e=>{S.docSel=+e.target.value||0};
  document.querySelectorAll('.add').forEach(b=>b.onclick=()=>addToCart(b.dataset.k));
  document.querySelectorAll('.now').forEach(b=>b.onclick=()=>buyNow(b.dataset.k));
  if($('#allTools'))$('#allTools').onclick=e=>{e.preventDefault();S.buy=false;draw()};
  if(S.buy){const f=document.querySelector(`input[name="o_${S.hl}"][value="report"]`)||document.querySelector(`input[name="o_${S.hl}"]`);if(f)f.checked=true}   // bawaan: sekali pakai untuk laporan ini
  if(S.hl){const el=document.getElementById('c_'+S.hl);if(el)el.scrollIntoView({block:'center'})}
}
function addToCart(key){
  const r=document.querySelector(`input[name="o_${key}"]:checked`);
  if(!r)return note('Pilih paket dulu (sekali pakai per laporan, atau 6/12/24 bulan).',1);
  const e=ALLI().find(x=>x.key===key);
  if(r.value==='feat'){if(S.cart.some(c=>c.module===key))return note('Sudah ada di keranjang.',1);
    S.cart.push({module:key,scope:'time',months:e.months,label:`${e.label} — langganan ${e.months} bulan`,price:e.price,list:e.price});note('Ditambahkan ke keranjang.',0);return cartBar()}
  if(r.value==='copy'){if(S.cart.some(c=>c.module===key&&c.scope==='copy'))return note('Sudah ada di keranjang.',1);
    S.cart.push({module:key,scope:'copy',label:`${e.label} — sekali impor`,price:e.price,list:e.price});note('Ditambahkan ke keranjang.',0);return cartBar()}
  if(r.value==='report'){
    if(!S.docSel)return note('Pilih laporan dulu untuk paket sekali pakai.',1);
    const t=(S.d.docs.find(x=>x.id===S.docSel)||{}).title||'#'+S.docSel;
    if(S.cart.some(c=>c.module===key&&c.scope==='report'&&c.doc_id===S.docSel))return note('Sudah ada di keranjang.',1);
    S.cart.push({module:key,scope:'report',doc_id:S.docSel,label:`${e.label} — sekali pakai: ${t}`,price:e.prices.report,list:e.list_prices.report});
  }else{
    const m=+r.value;if(S.cart.some(c=>c.module===key&&c.scope==='time'&&c.months===m))return note('Sudah ada di keranjang.',1);
    S.cart.push({module:key,scope:'time',months:m,label:`${e.label} — paket ${m} bulan`,price:e.prices[r.value],list:e.list_prices[r.value]});
  }
  note('Ditambahkan ke keranjang.',0);cartBar();
}
function buyNow(key){S.cart=[];addToCart(key);if(!S.cart.length)return;S.direct=true;$('#cgo').click()}
function cartBar(){
  const b=$('#cartbar');b.classList.toggle('hide',!S.cart.length||S.tab!=='toko');
  $('#ccount').textContent=S.cart.length+' item';$('#ctotal').textContent='Total '+rp(S.cart.reduce((a,c)=>a+(c.price||0),0))+' · untuk '+holdLabel();
}
function holdLabel(){return 'saya sendiri'}
$('#cclear').onclick=()=>{S.cart=[];cartBar()};
const PHONE_RE=/^(\+?62|0)8\d{8,12}$/,MAIL_RE=/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/;
function itemsHtml(items){return items.map(i=>`<div class="small" style="display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:3px 0"><span>${esc(LBL(i.module_key||i.module))} — ${i.scope==='copy'?'sekali impor':i.scope==='report'?'sekali pakai'+(i.doc_title?': '+esc(i.doc_title):''):i.months+' bln'}</span><span>${i.list_price&&i.list_price!==i.price?`<s class="mut">${rp(i.list_price)}</s> `:''}<b>${rp(i.price)}</b></span></div>`).join('')}
$('#cgo').onclick=()=>{
  const d=S.d,tot=S.cart.reduce((a,c)=>a+(c.price||0),0);
  const m=document.createElement('div');m.className='mask';
  m.innerHTML=`<form class="dlg"><b>Checkout — langkah 1 dari 2: data kontak</b>
   <div>${S.cart.map((c,i)=>`<div class="small" style="display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:3px 0"><span>${esc(c.label)}</span><span>${c.list&&c.list!==c.price?`<s class="mut">${rp(c.list)}</s> `:''}<b>${rp(c.price)}</b> <button type="button" data-rm="${i}" class="d small">✕</button></span></div>`).join('')}
     <div style="display:flex;justify-content:space-between;font-size:16px;margin-top:6px"><b>Total belanja</b><b>${rp(tot)}</b></div></div>
   <div class="small mut">Untuk: <b>${esc(holdLabel())}</b></div>
   <div class="note" id="cNote">📣 Pastikan <b>nomor WhatsApp</b> dan <b>email</b> di bawah ini <b>aktif</b>. Instruksi pembayaran dikirim ke email, dan pemberitahuan aktivasi lisensi oleh admin dikirim lewat <b>email dan WhatsApp</b>.</div>
   <label>Nomor WhatsApp aktif<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="081234567890" value="${esc(d.me.phone_wa||'')}"></label>
   <label>Email aktif<input name="email" type="email" autocomplete="email" placeholder="nama@perusahaan.com" value="${esc(d.me.email||'')}"></label>
   <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input type="checkbox" name="ok" style="width:18px;height:18px;margin:2px 0 0"> <span>Saya memastikan WhatsApp dan email di atas aktif dan dapat menerima pesan.</span></label>
   <div class="row" style="justify-content:flex-end"><button type="button" id="x">Batal</button><button class="p">Lanjut ke pembayaran →</button></div><span class="err small" id="e"></span></form>`;
  document.body.append(m);const f=m.querySelector('form');
  const closeCk=()=>{m.remove();if(S.direct){S.direct=false;S.cart=[];cartBar()}};
  m.querySelector('#x').onclick=closeCk;m.onclick=e=>{if(e.target===m)closeCk()};
  m.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.cart.splice(+b.dataset.rm,1);m.remove();cartBar();if(S.cart.length)$('#cgo').click()});
  f.onsubmit=async e=>{e.preventDefault();const E=f.querySelector('#e');E.textContent='';
    const ph=f.phone.value.replace(/[\s().\-]/g,''),em=f.email.value.trim();
    {
      if(!PHONE_RE.test(ph))return E.textContent='Nomor WhatsApp tidak valid. Gunakan nomor seluler Indonesia aktif, mis. 081234567890.';
      if(!MAIL_RE.test(em))return E.textContent='Email tidak valid. Gunakan alamat email aktif, mis. nama@perusahaan.com.';
      if(!f.ok.checked)return E.textContent='Centang pernyataan bahwa WhatsApp dan email Anda aktif.';
    }
    const btn=f.querySelector('button.p');btn.disabled=true;
    try{const r=await api('POST','/orders',{items:S.cart.map(c=>c.scope==='copy'?{module:c.module,scope:'copy'}:c.scope==='report'?{module:c.module,scope:'report',doc_id:c.doc_id}:{module:c.module,months:c.months}),
        contact:{phone:ph,email:em}});
      S.cart=[];S.direct=false;m.remove();await boot();
      payDlg(r.order,r.payment,r.notify)}
    catch(x){E.textContent=x.message;btn.disabled=false}};
};
const copyTxt=async t=>{try{await navigator.clipboard.writeText(t);return true}catch(e){const i=document.createElement('input');i.value=t;document.body.append(i);i.select();try{document.execCommand('copy')}catch(_){}i.remove();return true}};
function payDlg(o,pay,notify){
  const m=document.createElement('div');m.className='mask';
  m.innerHTML=`<form class="dlg"><b>Langkah 2 dari 2: bayar via QRIS — ${esc(pay.order_code)}</b>
   <div style="text-align:center"><div class="small mut">Nominal yang harus ditransfer</div>
    <div style="font-size:30px;font-weight:800;letter-spacing:.3px">${rp(pay.amount)}</div>
    <button type="button" id="cp" class="small">📋 Salin nominal</button></div>
   <div style="text-align:center"><img src="${esc(pay.qris_url)}" alt="QRIS" style="width:100%;max-width:300px;border:1px solid var(--line);border-radius:14px;background:#fff">
    <div class="small mut">${esc(pay.merchant)} · NMID ${esc(pay.nmid)}</div></div>
   <div class="note">Masukkan nominal <b>PERSIS ${rp(pay.amount)}</b> saat membayar agar mudah dicocokkan admin.</div>
   <ol class="small" style="padding-left:18px;margin:0 0 9px">${pay.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
   <div>${itemsHtml(o.items)}</div>
   ${notify&&(notify.email_buyer===true)?`<div class="small ok">✉ Instruksi pembayaran juga dikirim ke ${esc(o.contact_email||'email Anda')}.</div>`:(notify&&notify.email_buyer===false?'<div class="small mut">Email instruksi belum terkirim (server email belum diatur) — gunakan layar ini.</div>':'')}
   <div id="pst"></div>
   <div id="pup"><label>Unggah tangkapan layar bukti transfer QRIS<input name="proof" type="file" accept="image/*"></label>
    <div class="small mut">Bukti harus memperlihatkan <b>nominal</b>, status <b>BERHASIL</b>, serta <b>tanggal &amp; jam</b> transaksi. Sistem membacanya otomatis (OCR).</div>
   <div class="row" style="justify-content:flex-end"><button type="button" id="x">Nanti saja</button><button class="p" id="up">📤 Unggah &amp; verifikasi</button></div></div><span class="err small" id="e"></span></form>`;
  document.body.append(m);const f=m.querySelector('form');
  m.querySelector('#x').onclick=()=>{m.remove();boot()};m.onclick=e=>{if(e.target===m)m.querySelector('#x').click()};
  m.querySelector('#cp').onclick=async e=>{await copyTxt(String(pay.amount));e.target.textContent='✓ Tersalin'};
  const pst=f.querySelector('#pst'),pup=f.querySelector('#pup'),E=f.querySelector('#e');
  const done=flag=>{m.remove();if(backTo(flag))return;boot()};
  const show=(html)=>{pst.innerHTML=html};
  f.onsubmit=async e=>{e.preventDefault();E.textContent='';
    const file=f.proof.files[0];if(!file)return E.textContent='Pilih dulu berkas tangkapan layar bukti transfer.';
    const btn=f.querySelector('#up');btn.disabled=true;btn.textContent='Membaca bukti… (OCR)';
    try{const fd=new FormData();fd.append('proof',file);
      const rr=await fetch(`/api/license/orders/${o.id}/proof`,{method:'POST',credentials:'same-origin',headers:{'X-CMS':'1'},body:fd});
      const r=await rr.json().catch(()=>({}));if(!rr.ok)throw new Error(r.error||('HTTP '+rr.status));
      f.proof.value='';btn.disabled=false;btn.textContent='📤 Unggah & verifikasi';
      if(r.result==='paid'){show(`<div class="note" style="background:#15803d22;color:var(--ok)">✅ Pembayaran terverifikasi otomatis. Lisensi sudah aktif.</div>`);pup.classList.add('hide');setTimeout(()=>{S.cart=[];boot().then(()=>done('ok'))},1200)}
      else if(r.result==='short'){pup.classList.add('hide');
        show(`<div class="note"><b>⚠ Nominal tidak sama.</b> Terbaca ${rp(r.amount_found)}, kurang dari total ${rp(r.total)}.<br>Apakah Anda sudah mentransfer <b>${rp(r.total)}</b> lewat QRIS?
          <div class="row"><button type="button" class="p" id="yes">Ya, sudah</button><button type="button" id="no">Belum</button></div></div>`);
        f.querySelector('#yes').onclick=()=>{show(`<div class="note">Baik. Mohon <b>unggah ulang</b> bukti transfer yang jelas (nominal, status berhasil, tanggal &amp; jam terlihat penuh). Ini kesempatan terakhir pemeriksaan otomatis; bila masih tidak cocok, admin akan memverifikasi manual.</div>`);pup.classList.remove('hide')};
        f.querySelector('#no').onclick=()=>{show(`<div class="note">Silakan transfer <b>${rp(r.total)}</b> lebih dulu lewat QRIS, lalu unggah buktinya.</div>`);pup.classList.remove('hide')}}
      else if(r.result==='retry'){show(`<div class="note"><b>Bukti belum bisa diverifikasi:</b> ${esc((r.reasons||[]).join('; '))}.<br>Mohon unggah ulang tangkapan layar yang lebih jelas (seluruh layar bukti, tidak terpotong). Ini kesempatan terakhir pemeriksaan otomatis.</div>`)}
      else{pup.classList.add('hide');show(`<div class="note"><b>🔎 Perlu verifikasi manual.</b> Admin akan segera menghubungi Anda. Status sementara: <b>butuh verifikasi manual</b> — lisensi aktif setelah admin memeriksa bukti Anda.${r.reasons&&r.reasons.length?`<div class="small">Alasan: ${esc(r.reasons.join('; '))}</div>`:''}<div class="row" style="justify-content:flex-end"><button type="button" class="p" id="okm">Mengerti</button></div></div>`);
        f.querySelector('#okm').onclick=()=>{boot().then(()=>done('wait'))}}
    }catch(x){E.textContent=x.message;btn.disabled=false;btn.textContent='📤 Unggah & verifikasi'}};
}
async function openPay(id){try{const r=await api('GET',`/orders/${id}/payment`);payDlg(r.order,r.payment,null)}catch(e){note(e.message,1)}}

boot().then(()=>{if(QS.get('pay'))openPay(QS.get('pay'))});
</script></body></html>
