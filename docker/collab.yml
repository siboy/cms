# Stack kolaborasi CMS: MySQL 8 + Redis 7 (terpisah dari stack flask/sekda).
# Deploy di server: /home/databoks/cms-collab  (docker compose up -d)
# Sandi ada di .env di folder itu (dibuat oleh scripts/collab_deploy.sh), TIDAK di-commit.
# Port hanya dibuka ke 127.0.0.1 server; akses dari luar lewat SSH tunnel atau dari container di jaringan cms-net.
name: cmscollab

services:
  mysql:
    image: mysql:8.0
    container_name: cms-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi di .env}
      MYSQL_DATABASE: cms
      MYSQL_USER: cms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?isi di .env}
    volumes:
      - cms_mysql_data:/var/lib/mysql
      - ./mysql/cms.cnf:/etc/mysql/conf.d/cms.cnf:ro
      - ./init:/docker-entrypoint-initdb.d:ro      # dijalankan sekali saat data dir kosong
    ports:
      - "127.0.0.1:3307:3306"
    mem_limit: 4g
    networks: [cms-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: cms-redis
    restart: unless-stopped
    # lock blok, presence, pub/sub, antrian ekspor. noeviction: jangan buang kunci diam-diam.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?isi di .env}
      --maxmemory 1gb --maxmemory-policy noeviction
      --appendonly yes --appendfsync everysec
      --maxclients 5000 --tcp-backlog 1024
    volumes:
      - cms_redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    mem_limit: 1200m
    networks: [cms-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  app:
    image: cms-collab:dev
    container_name: cms-app
    restart: unless-stopped
    command: >
      gunicorn -k gevent -w ${CMS_WORKERS:-4} --worker-connections 1000
      -b 0.0.0.0:8879 --timeout 120 --graceful-timeout 20 --keep-alive 30
      --access-logfile - "cmsapp:create_app()"
    environment: &appenv
      TZ: Asia/Jakarta
      PYTHONPATH: /app
      CMS_DB_HOST: cms-mysql
      CMS_DB_USER: cms
      CMS_DB_PASS: ${MYSQL_PASSWORD}
      CMS_DB_NAME: cms
      CMS_DB_POOL: "12"
      CMS_REDIS_URL: redis://:${REDIS_PASSWORD}@cms-redis:6379/0
      CMS_SECRET_KEY: ${CMS_SECRET_KEY:?isi di .env}
      CMS_DATA_DIR: /data
      CMS_EXPORT_DIR: /data/exports
    volumes:
      - cms_data:/data
    ports:
      - "127.0.0.1:8879:8879"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 2g
    networks: [cms-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8879/health',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: cms-collab:dev
    container_name: cms-worker
    restart: unless-stopped
    command: python -m cmsapp.worker
    environment: *appenv
    volumes:
      - cms_data:/data
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 2g
    networks: [cms-net]

networks:
  cms-net:
    name: cms-net

volumes:
  cms_mysql_data:
  cms_redis_data:
  cms_data:
