# Hub sdrive: apex (sdrive.team) = halaman "kode perusahaan" + /api/resolve; *.sdrive.team = router ke tenant.
# Template: placeholder __DOMAIN__ / __PORT__ diisi scripts/hub-sync.sh; tenants.conf (peta kode & host) juga
# di-generate dari .env tiap tenant. Jangan edit hasilnya di $HOME/cms-tenants/_hub — edit template ini.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # IP asli klien (Cloudflare mengirim CF-Connecting-IP); app tenant memakai X-Real-IP utk rate-limit login
    map $http_cf_connecting_ip $real_ip { default $http_cf_connecting_ip; "" $remote_addr; }

    limit_req_zone $real_ip zone=resolve:1m rate=30r/m;

    # $hub_port (host -> port tenant) dan $hub_target (kode -> host kanonik)
    include /etc/nginx/hub/tenants.conf;

    # ---- apex: hub
    server {
        listen 127.0.0.1:__PORT__;
        server_name __DOMAIN__ www.__DOMAIN__;
        root /etc/nginx/hub/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = / { try_files /index.html =404; add_header Cache-Control "no-store"; }
        location = /health { default_type text/plain; return 200 "ok\n"; }

        # GET /api/resolve?code=chp -> {"ok":true,"url":"https://chp.__DOMAIN__"} | 404 {"ok":false}
        location = /api/resolve {
            limit_req zone=resolve burst=10 nodelay;
            limit_req_status 429;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            if ($hub_target = "") { return 404 '{"ok":false,"error":"kode perusahaan tidak dikenal"}'; }
            return 200 '{"ok":true,"url":"https://$hub_target"}';
        }
        location / { return 404; }
    }

    # ---- *.__DOMAIN__: router ke tenant berdasarkan Host (hostname eksplisit di tunnel tetap menang)
    server {
        listen 127.0.0.1:__PORT__ default_server;
        server_name *.__DOMAIN__;
        client_max_body_size 25m;                     # selaras CMS_UPLOAD_MAX_MB (20) + overhead multipart

        if ($hub_port = "") { return 404 "Perusahaan tidak ditemukan\n"; }
        error_page 502 503 504 = @down;
        location @down { default_type text/plain; return 503 "Server perusahaan sedang tidak aktif\n"; }

        # SSE (realtime): jangan dibuffer, timeout panjang
        location ~ ^/api/docs/[0-9]+/events$ {
            proxy_pass http://127.0.0.1:$hub_port;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            chunked_transfer_encoding off;
        }
        location / {
            proxy_pass http://127.0.0.1:$hub_port;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 180s;
        }
    }
}
