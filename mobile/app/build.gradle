plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
def hasReleaseKs = System.getenv("CMS_KEYSTORE_PATH") != null
android {
    namespace 'team.sdrive.cms'
    compileSdk 36
    defaultConfig {
        applicationId "team.sdrive.cms"      // SATU appId utk semua perusahaan (single APK multi-tenant)
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }
    signingConfigs {
        if (hasReleaseKs) {
            release {
                storeFile file(System.getenv("CMS_KEYSTORE_PATH"))
                storePassword System.getenv("CMS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CMS_KEY_ALIAS")
                keyPassword System.getenv("CMS_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        // keystore rilis via env CMS_KEYSTORE_* (lihat `make apk`); tanpa env ini jatuh ke debug key
        release { minifyEnabled false; signingConfig hasReleaseKs ? signingConfigs.release : signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
